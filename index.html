<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคลังเกียรติยศดิจิทัล - โรงเรียนพิมานพิทยาสรรค์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #1a1d24;          /* สีพื้นหลังมืดสนิทตามภาพตัวอย่าง */
            --bg-card: #2b303c;          /* สีพื้นหลังของการ์ดแต่ละใบ */
            --border-card: #373e4d;      /* สีขอบการ์ดเพิ่มมิติคมชัด */
            --sidebar-bg: #ffffff;       /* เมนูด้านซ้ายสีขาวคลีน */
            --text-dark: #1e293b;
            --text-light: #ffffff;
            --text-muted: #94a3b8;

            /* 🎨 ชุดสีกล่องข้อมูลและหัวข้อตามรูปเป๊ะๆ */
            --school-badge: #98c2b3;     /* หัวข้อเขียวมิ้นท์ */
            --school-box: #84ada0;       /* กล่องข้อความเขียวมิ้นท์ทึบ */
            
            --staff-badge: #9ec5e8;      /* หัวข้อฟ้าอ่อน */
            --staff-box: #8db3d9;        /* กล่องข้อความฟ้าทึบ */
            
            --student-badge: #f5b99a;    /* หัวข้อส้มโอรส */
            --student-box: #e09e7d;      /* กล่องข้อความส้มทึบ */

            --btn-blue: #7eaacf;         /* สีปุ่มเปิดดูเกียรติบัตรตามภาพ */
        }

        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-light); 
            overflow-x: hidden; 
            font-size: 0.88rem; 
        }

        /* 📌 Sidebar ฝั่งซ้าย */
        .sidebar { 
            position: fixed; 
            top: 0; bottom: 0; left: 0; z-index: 100; 
            width: 280px; 
            padding: 30px 20px; 
            background-color: var(--sidebar-bg); 
            border-right: 1px solid rgba(0,0,0,0.08); 
            box-shadow: 4px 0 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease; 
        }
        .sidebar .text-slate { color: var(--text-dark) !important; }

        .main-content { margin-left: 280px; padding: 30px; transition: all 0.3s ease; }

        /* 🏛️ ส่วนแสดงโลโก้โรงเรียนฝั่งซ้าย */
        .logo-wrapper { text-align: center; margin-bottom: 25px; }
        .school-logo { width: 80px; height: auto; margin-bottom: 12px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1)); }

        /* 👑 แบนเนอร์หัวเว็บสไตล์เข้มหรูหรา */
        .banner-card { 
            background: linear-gradient(135deg, #111318 0%, #20242e 100%); 
            border: 1px solid var(--border-card);
            border-radius: 12px; 
            padding: 22px 30px; 
            margin-bottom: 35px; 
            display: flex;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .banner-text h3 { font-size: 1.45rem; font-weight: 700; color: #ffffff; margin: 0; letter-spacing: 0.5px; }
        .banner-text p { font-size: 0.85rem; color: #a1b0cb; margin: 6px 0 0; }
        .obec-logo { width: 52px; height: auto; margin-right: 20px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        
        /* 🔘 ปุ่มเมนูด้านซ้าย */
        .nav-menu-btn { 
            display: flex; align-items: center; width: 100%; 
            padding: 12px 16px; margin-bottom: 6px; 
            border: none; background: transparent; border-radius: 8px; 
            color: #475569; font-weight: 400; transition: all 0.2s; 
        }
        .nav-menu-btn i { font-size: 1.05rem; width: 28px; color: #64748b; }
        .nav-menu-btn:hover { background-color: #f1f5f9; color: var(--text-dark); }
        .nav-menu-btn.active { background: linear-gradient(135deg, #dfba6b 0%, #c29d4c 100%); color: #ffffff; font-weight: 500; }
        .nav-menu-btn.active i { color: #ffffff; }
        
        /* 🏅 จัดการ 5 การ์ดต่อแถวบนหน้าจอใหญ่เดสก์ท็อป */
        @media (min-width: 1200px) {
            .col-xl-2-4 { flex: 0 0 20%; max-width: 20%; }
        }

        /* 🏷️ หัวข้อกลุ่มรางวัลทรงแคปซูลมนเด่นชัดตามภาพ */
        .category-badge-title {
            display: inline-flex;
            align-items: center;
            padding: 7px 22px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 18px;
            color: #111622;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }
        .title-school { background-color: var(--school-badge); }
        .title-staff { background-color: var(--staff-badge); }
        .title-student { background-color: var(--student-badge); }

        /* 🃏 ตัวการ์ดสไตล์ Dark โทนสีและขอบเงาตามภาพตัวอย่าง */
        .award-card { 
            border-radius: 12px; 
            border: 1px solid var(--border-card);
            background-color: var(--bg-card); 
            transition: all 0.25s ease;
            display: flex; flex-direction: column; height: 100%; overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.25);
        }
        .award-card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px rgba(0,0,0,0.45); border-color: #4f5b73; }

        /* หัวการ์ดไอคอนคู่ */
        .card-header-icon { 
            height: 48px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.03); 
        }
        .card-header-icon i { font-size: 1.2rem; }
        .card-header-icon .fa-medal { color: #eab308; }

        .card-body-content { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .award-title { font-size: 0.85rem; font-weight: 400; color: #ffffff; line-height: 1.4; margin-bottom: 12px; height: 2.8em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        /* 🗃️ กล่องข้อมูลภายในตัวการ์ด (สีทึบตามหมวดหมู่เด่นชัด) */
        .meta-box { border-radius: 6px; padding: 10px; margin-bottom: 12px; font-size: 0.76rem; color: #0f172a; font-weight: 500; }
        .meta-item { display: flex; align-items: flex-start; margin-bottom: 6px; line-height: 1.4; }
