<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PMS Digital Honor App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

:root{
    --primary:#8B0000;
    --primary-dark:#650000;
    --gold:#D4AF37;
    --bg:#F4F7FA;
    --text:#1E293B;
    --text-light:#64748B;
    --border:#E2E8F0;
    --radius:18px;
}

/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Prompt',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

.d-none{
    display:none !important;
}

/* =========================
   APP LAYOUT
========================= */
.app-container{
    width:100%;
    min-height:100vh;
    padding-top:85px;
    padding-bottom:95px;
}

.content-wrap{
    max-width:1400px;
    margin:auto;
    padding:15px;
}

/* =========================
   SCROLLBAR
========================= */
::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#CBD5E1;
    border-radius:20px;
}

/* =========================
   LOADING SCREEN
========================= */
.loading-screen{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
}

.loading-logo{
    width:90px;
    animation:pulse 1.5s infinite;
}

.loading-title{
    font-size:1.2rem;
    font-weight:700;
    color:var(--primary);
}

.loading-sub{
    color:var(--text-light);
}

.loading-spinner{
    width:45px;
    height:45px;
    border:5px solid #eee;
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

/* =========================
   HEADER
========================= */
.mobile-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:75px;
    background:#fff;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    box-shadow:0 2px 15px rgba(0,0,0,.08);
    z-index:1000;
}

.logo-box img{
    width:48px;
    height:48px;
    object-fit:contain;
}

.system-title{
    display:none;
}

.search-box{
    flex:1;
    background:#F1F5F9;
    border-radius:14px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    color:var(--text-light);
}

.add-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
}

/* =========================
   DESKTOP
========================= */
@media(min-width:992px){
    .mobile-header{
        height:90px;
        padding:15px 30px;
    }

    .system-title{
        display:block;
    }

    .system-title h1{
        font-size:1.1rem;
        font-weight:800;
        color:var(--primary);
        margin:0;
    }

    .system-title p{
        font-size:.8rem;
        color:var(--text-light);
        margin:0;
    }

    .app-container{
        padding-top:110px;
    }
}

/* =========================
   SEARCH SCREEN
========================= */
.search-screen{
    position:fixed;
    inset:0;
    background:#F8FAFC;
    z-index:3000;
    overflow-y:auto;
}

.search-header{
    position:sticky;
    top:0;
    background:#fff;
    display:flex;
    gap:10px;
    padding:15px;
    box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.search-header input{
    flex:1;
    height:45px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#F1F5F9;
    padding:0 15px;
}

.search-back-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:12px;
    background:#F1F5F9;
}

/* FILTER */
.search-filter-panel{
    background:#fff;
    margin:15px;
    padding:18px;
    border-radius:16px;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.search-filter-title{
    font-weight:700;
    color:var(--primary);
    margin-bottom:10px;
}

.filter-label{
    display:block;
    margin-top:10px;
    font-size:.9rem;
    font-weight:600;
}

.filter-select{
    width:100%;
    height:42px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:0 10px;
}

/* =========================
   CARD SYSTEM
========================= */
.section-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin:25px 0 15px;
    padding:14px 18px;
    background:linear-gradient(135deg,var(--primary),#B22222);
    color:#fff;
    border-radius:14px;
    font-weight:700;
}

.row.g-3{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}


/* CARD */
.award-card{
    background:#fff;
    border-radius:22px;
    padding:22px;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    transition:.25s ease;
    min-height:220px;
}

.award-card:hover{
    transform:translateY(-6px);
    box-shadow:0 18px 40px rgba(0,0,0,.14);
}

/* TOP GRADIENT BAR */
.award-card::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:70px;
    background:linear-gradient(135deg,#7A0000,#A00000,#D4AF37);
}

/* ICON */
.award-icon{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    width:52px;
    height:52px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
    z-index:2;
}

/* LEVEL BADGE */
.award-level{
    position:absolute;
    top:12px;
    right:12px;
    background:rgba(255,255,255,.9);
    border:1px solid rgba(139,0,0,.2);
    padding:5px 10px;
    border-radius:20px;
    font-size:.75rem;
    font-weight:700;
    color:#8B0000;
}

/* TITLE */
.award-title{
    margin-top:70px;
    font-size:1.05rem;
    font-weight:800;
    padding-bottom:10px;
    border-bottom:1px solid #eee;
}

/* DETAIL */
.award-detail{
    margin-top:12px;
    font-size:.9rem;
    line-height:1.7;
    color:#374151;
}

/* GOLD LINE */
.award-card::after{
    content:"";
    position:absolute;
    top:70px;
    left:0;
    right:0;
    height:3px;
    background:#D4AF37;
}

/* BUTTON */
.btn-view-award{
    margin-top:12px;
    width:100%;
    padding:10px;
    border:none;
    border-radius:10px;
    background:var(--gold);
    color:#000;
    font-weight:600;
}

/* =========================
   AWARD FORM PRO
========================= */

.award-form-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
}

.award-form-container{
    width:100%;
    max-width:900px;
    max-height:90vh;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.award-form-header{
    background:linear-gradient(
        135deg,
        #8B0000,
        #B22222
    );
    color:#fff;
    padding:18px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.award-form-header h5{
    margin:0;
    font-weight:700;
}

.award-form-header button{
    border:none;
    background:none;
    color:#fff;
    font-size:22px;
}

.award-form-body{
    flex:1;
    overflow-y:auto;
    padding:25px;
    background:#f8fafc;
}

.form-action-bar{
    padding:18px;
    background:#fff;
    border-top:1px solid #e5e7eb;
    display:flex;
    gap:12px;
}

@media(max-width:768px){

    .award-form-container{
        max-height:100vh;
        border-radius:0;
    }

}

/* =========================
   TAB BAR
========================= */
.bottom-tabbar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:#fff;
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid #eee;
    z-index:1000;
}

.tab-item{
    background:none;
    border:none;
    font-size:12px;
    color:var(--text-light);
    display:flex;
    flex-direction:column;
    align-items:center;
}

.tab-item.active{
    color:var(--primary);
}

#toastBox{
    position:fixed;
    top:20px;
    right:20px;
    z-index:99999;
}

.toast-msg{
    min-width:300px;
    background:#fff;
    padding:15px 20px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    margin-bottom:10px;
    animation:slideIn .3s ease;
}

.toast-success{
    border-left:5px solid #16A34A;
}

.toast-error{
    border-left:5px solid #DC2626;
}

@keyframes slideIn{
    from{
        transform:translateX(100%);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}
</style>

</head>
<body>

<!-- LOADING -->
<div id="loading-screen" class="loading-screen">

  <img
    src="https://raw.githubusercontent.com/phiman-2026/picture/main/logo%20phiman.png"
    class="loading-logo"
    alt="logo">

  <div class="loading-spinner"></div>
  <div class="loading-title">PMS Digital Honor App</div>
  <div class="loading-sub">กำลังโหลดข้อมูล...</div>

</div>

<!-- APP -->
<div class="app-container">

  <!-- HEADER -->
  <header class="mobile-header">

    <div class="logo-box">
      <img src="https://raw.githubusercontent.com/phiman-2026/picture/main/logo%20phiman.png">
    </div>

    <div class="search-box" onclick="openSearchScreen()">
      <i class="fa-solid fa-search"></i>
      <span>ค้นหารางวัล...</span>
    </div>

    <button class="add-btn" onclick="openAwardForm()">
      <i class="fa-solid fa-plus"></i>
    </button>

  </header>

  <!-- CONTENT -->
  <main class="content-wrap">

  </main>

</div>

<!-- SEARCH -->
<div id="search-screen" class="search-screen d-none">

  <div class="search-header">

    <button class="search-back-btn" onclick="closeSearchScreen()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <input id="search-input"
           placeholder="ค้นหารางวัล..."
           onkeyup="searchAwards()">

  </div>

  <!-- FILTER PANEL -->
  <div class="search-filter-panel">

    <label class="filter-label">ปีการศึกษา</label>
    <select id="filter-year" onchange="setFilter('year', this.value)" class="filter-select">
      <option value="all">ทั้งหมด</option>

    <label class="filter-label">กลุ่มสาระ</label>
    <select id="filter-dept" onchange="setFilter('dept', this.value)" class="filter-select">
      <option value="all">ทั้งหมด</option>
      <option value="วิทยาศาสตร์และเทคโนโลยี">วิทยาศาสตร์และเทคโนโลยี</option>
      <option value="คณิตศาสตร์">คณิตศาสตร์</option>
      <option value="ภาษาไทย">ภาษาไทย</option>
    </select>

  </div>

  <div id="search-result-container" class="content-wrap"></div>

</div>

<!-- FORM MODAL (สำคัญ ต้องเก็บ) -->
<div id="awardFormModal" class="award-form-modal d-none">

  <div class="award-form-container">

    <div class="award-form-header">
      <h5>บันทึกรางวัลใหม่</h5>
      <button onclick="closeAwardForm()">✕</button>
    </div>

    <div class="award-form-body">

     <form id="awardForm">

  <!-- ประเภท + ปีการศึกษา -->

    <div class="col-md-6">

      <select id="awardType"

    <select id="awardDept"

      <option value="สังคมศึกษา ศาสนา และวัฒนธรรม">
        สังคมศึกษา ศาสนา และวัฒนธรรม
      </option>

      <option value="สุขศึกษาและพลศึกษา">

      </option>

      <option value="ศิลปะ">

</div>

  <button class="tab-item active" id="nav-home" onclick="changeTab('home')">

<script>
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxE7FswOf3r9E6olu-_Ss-CH4VMwT1A2Cs45WZsjR5LBvbHe3LymyXVUfNTJwU5xBXhLg/exec";

const TYPE_CONFIG = {
  school: {
    icon: "🏫",
    color: "#8B0000",
    title: "รางวัลสถานศึกษา"
  },
  staff: {
    icon: "👨‍🏫",
    color: "#2563EB",
    title: "รางวัลครู"
  },
  student: {
    icon: "🎓",
    color: "#16A34A",
    title: "รางวัลนักเรียน"
  }
};
      
let filters = {
  year: "all",
  level: "all",
  dept: "all"
};
      
let allAwardsData = {
  school: [],
  staff: [],
  student: []
};

let currentTab = "home";

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", () => {
  initApp();
});

async function initApp() {
  showLoadingScreen();
  await loadAwards();
  hideLoadingScreen();
  renderHomePage();
}

/* =========================
   LOAD DATA
========================= */
async function loadAwards() {
  try {
    const res = await fetch(GAS_WEB_APP_URL);
    const data = await res.json();
    allAwardsData = data;
  } catch (err) {
    console.error(err);
    alert("โหลดข้อมูลไม่สำเร็จ");
  }
}

/* =========================
   LOADING
========================= */
function showLoadingScreen() {
  document.getElementById("loading-screen").style.display = "flex";
}

function hideLoadingScreen() {
  document.getElementById("loading-screen").style.display = "none";
}

/* =========================
   HOME
========================= */
function renderHomePage() {
  const zone = document.getElementById("app-content");
  zone.innerHTML = "";

  renderSection("school", "รางวัลสถานศึกษา");
  renderSection("staff", "รางวัลครูและบุคลากร");
  renderSection("student", "รางวัลนักเรียน");
}

/* =========================
   SECTION + CARDS (MAIN)
========================= */
function renderSection(type, title) {
  const zone = document.getElementById("app-content");

  let data = (allAwardsData[type] || []).slice().reverse();

  // ===== FILTER SYSTEM =====
  data = data.filter(item => {

    const yearMatch =
      filters.year === "all" ||
      item["ปีการศึกษา"] == filters.year;

    const levelMatch =
      filters.level === "all" ||
      item["ระดับรางวัล"] == filters.level;

    const deptMatch =
      filters.dept === "all" ||
      (item["กลุ่มสาระการเรียนรู้"] || "") == filters.dept;

    return yearMatch && levelMatch && deptMatch;
  });

  // limit
  data = data.slice(0, 12);

  zone.insertAdjacentHTML("beforeend", `
    <div class="section-title">🏆 ${title}</div>
    <div class="row g-3 mb-4" id="row-${type}"></div>
  `);

  const row = document.getElementById(`row-${type}`);
  buildCards(row, data, type);
}

/* =========================
   CARD BUILDER (สำคัญ)
========================= */
function buildCards(container, data, type) {

  const config = TYPE_CONFIG[type] || TYPE_CONFIG.school;

  data.forEach(item => {

    const title = item["ชื่อรางวัล/ผลงานเกียรติยศ"] || "-";
    const year = item["ปีการศึกษา"] || "-";
    const level = item["ระดับรางวัล"] || "-";
    const giver = item["หน่วยงานที่มอบรางวัล"] || "-";
    const dept = item["กลุ่มสาระการเรียนรู้"] || "";
    const className = item["ชั้นเรียน"] || "";

    let person = "";

    if (type === "school") {
      person = "โรงเรียนพิมานพิทยาสรรค์";
    }

    if (type === "staff") {
      person = item["ชื่อ-นามสกุลของคุณครู / บุคลากรผู้ได้รับรางวัล"] || "-";
    }

    if (type === "student") {
      person = item["ชื่อ-นามสกุลนักเรียนที่ได้รับรางวัล"] || "-";
    }

    container.insertAdjacentHTML(
      "beforeend",
      createCardHTML(type, title, person, giver, year, level, dept, className, config)
    );
  });
}

/* =========================
   CARD HTML
========================= */
function createCardHTML(type, title, person, giver, year, level, dept, className, config) {

  return `
  <div class="col-12 col-md-6 col-lg-4">
    <div class="award-card ${type}" style="border-top:4px solid ${config.color}">

      <div class="award-icon">${config.icon}</div>

      <div class="award-level" style="color:${config.color};border-color:${config.color}">
        ${level}
      </div>

      <div class="award-title">${title}</div>

      <div class="award-detail">

        <div><b>ผู้ได้รับ :</b><br>${person}</div>

        ${className ? `<div class="mt-2"><b>ชั้นเรียน :</b><br>${className}</div>` : ""}

        ${dept ? `<div class="mt-2"><b>กลุ่มสาระ :</b><br>${dept}</div>` : ""}

        <div class="mt-2"><b>หน่วยงาน :</b><br>${giver}</div>

        <div class="mt-2"><b>ปีการศึกษา :</b><br>${year}</div>

      </div>

    </div>
  </div>
  `;
}

/* =========================
   TAB SYSTEM (FIXED)
========================= */
function changeTab(tab) {

  currentTab = tab;

  document.querySelectorAll(".tab-item")
    .forEach(el => el.classList.remove("active"));

  document.getElementById("nav-" + tab).classList.add("active");

  const zone = document.getElementById("app-content");
  zone.innerHTML = "";

  if (tab === "home") {
    renderHomePage();
    return;
  }

  renderSection(
    tab,
    tab === "school"
      ? "รางวัลสถานศึกษา"
      : tab === "staff"
        ? "รางวัลครูและบุคลากร"
        : "รางวัลนักเรียน"
  );
}

/* =========================
   SEARCH (FIXED)
========================= */
function openSearchScreen() {
  document.getElementById("search-screen").classList.remove("d-none");
  document.body.style.overflow = "hidden";
}

function closeSearchScreen() {
  document.getElementById("search-screen").classList.add("d-none");
  document.body.style.overflow = "";
}

function searchAwards() {

  const keyword = document.getElementById("search-input").value.toLowerCase();

  let result = [];

  ["school", "staff", "student"].forEach(type => {

    (allAwardsData[type] || []).forEach(item => {

      const matchText = JSON.stringify(item).toLowerCase();

      const filterMatch =
        (filters.year === "all" || item["ปีการศึกษา"] == filters.year) &&
        (filters.level === "all" || item["ระดับรางวัล"] == filters.level) &&
        (filters.dept === "all" || (item["กลุ่มสาระการเรียนรู้"] || "") == filters.dept);

      if (matchText.includes(keyword) && filterMatch) {
        result.push({ type, item });
      }
    });

  });

  renderSearchResult(result);
}

/* =========================
   SEARCH RESULT
========================= */
function renderSearchResult(result) {

  const zone = document.getElementById("search-result-container");
  zone.innerHTML = "";

  if (result.length === 0) {
    zone.innerHTML = `<div class="empty-box">ไม่พบข้อมูล</div>`;
    return;
  }

  result.forEach(obj => {

    const wrap = document.createElement("div");
    wrap.className = "mb-3";

    buildCards(wrap, [obj.item], obj.type);

    zone.appendChild(wrap);
  });
}

========================= */
function openPDF(url) {

  if (!url) return alert("ไม่พบไฟล์");

  if (url.includes("drive.google.com")) {
    url = url.replace("/view", "/preview");
  }

  window.open(url, "_blank");
}

function renderDashboard() {
  // ตอนนี้ยังไม่ทำ filter logic เต็ม

  if (currentTab === "home") {

async function saveAward() {

  const btn = document.getElementById("btn-save");

  // =====================
  // ดึงข้อมูลจากฟอร์ม
  // =====================

  const type =
    document.getElementById("awardType").value;

  const year =
    document.getElementById("awardYear").value.trim();

  const dept =
    document.getElementById("awardDept").value.trim();

  const rewardLevel =
    document.getElementById("awardLevel").value.trim();

  const title =
    document.getElementById("awardTitle").value.trim();

  const giver =
    document.getElementById("awardGiver").value.trim();

  const file =
    document.getElementById("awardFile").files[0];

  let name = "";
  let className = "";

  // =====================
  // ตรวจสอบข้อมูลพื้นฐาน
  // =====================

  if (!year) {
    alert("กรุณาระบุปีการศึกษา");
    return;
  }

  if (!rewardLevel) {
    alert("กรุณาเลือกระดับรางวัล");
    return;
  }

  if (!title) {
    alert("กรุณากรอกชื่อรางวัล");
    return;
  }

  if (!giver) {
    alert("กรุณากรอกหน่วยงานที่มอบรางวัล");
    return;
  }

  if (!file) {
    alert("กรุณาแนบไฟล์ PDF");
    return;
  }

  // =====================
  // รางวัลครู
  // =====================

  if (type === "staff") {

    name =
      document.getElementById("awardPerson")?.value.trim() || "";

    if (!name) {
      alert("กรุณากรอกชื่อครู/บุคลากร");
      return;
    }

    if (!dept) {
      alert("กรุณาเลือกกลุ่มสาระ");
      return;
    }
  }

  // =====================
  // รางวัลนักเรียน
  // =====================

  if (type === "student") {

    name =
      document.getElementById("awardPerson")?.value.trim() || "";

    className =
      document.getElementById("awardClass")?.value.trim() || "";

    if (!name) {
      alert("กรุณากรอกชื่อนักเรียน");
      return;
    }

    if (!className) {
      alert("กรุณากรอกชั้นเรียน");
      return;
    }

    if (!dept) {
      alert("กรุณาเลือกกลุ่มสาระ");
      return;
    }
  }

  // =====================
  // ตรวจสอบไฟล์
  // =====================

  if (file.type !== "application/pdf") {
    alert("อนุญาตเฉพาะไฟล์ PDF เท่านั้น");
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    alert("ไฟล์ใหญ่เกิน 10 MB");
    return;
  }

  // =====================
  // เริ่มบันทึก
  // =====================

  btn.disabled = true;
  btn.innerHTML = `
    <i class="fa-solid fa-spinner fa-spin"></i>
    กำลังบันทึก...
  `;

  try {

    const fileBase64 =
      await convertFileToBase64(file);

    const payload = {
      type,
      year,
      rewardLevel,
      title,
      giver,
      name,
      dept,
      className,
      fileData: fileBase64,
      fileMimeType: file.type
    };

    const response = await fetch(
      GAS_WEB_APP_URL,
      {
        method: "POST",
        body: JSON.stringify(payload)
      }
    );

    const result = await response.json();

    if (result.status !== "success") {
      throw new Error(
        result.message || "เกิดข้อผิดพลาด"
      );
    }

    alert("🎉 บันทึกรางวัลสำเร็จ");

    document.getElementById("awardForm").reset();

    document.getElementById("pdfPreview").innerHTML = "";

    closeAwardForm();

    await loadAwards();

    if (currentTab === "home") {
      renderHomePage();
    } else {
      changeTab(currentTab);
    }

  } catch (err) {

    console.error(err);

    alert(
      "❌ บันทึกไม่สำเร็จ\n\n" +
      err.message
    );

  } finally {

    btn.disabled = false;

    btn.innerHTML = `
      <i class="fa-solid fa-floppy-disk"></i>
      บันทึก
    `;
  }
}

function convertFileToBase64(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {

      const base64 =
        reader.result.split(",")[1];

      resolve(base64);
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

function setFilter(type, value) {
  filters[type] = value;
  renderHomePage(); // รีโหลดหน้าหลัก
}

function resetFilters() {
  filters = { year: "all", level: "all", dept: "all" };
  renderHomePage();
}

function showSuccessPopup(){

  const box =
    document.getElementById("toastBox");

  const toast =
    document.createElement("div");

  toast.className =
    "toast-msg toast-success";

  toast.innerHTML =
    "✅ บันทึกข้อมูลสำเร็จ";

  box.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },3000);
}

function showErrorPopup(msg){

  const box =
    document.getElementById("toastBox");

  const toast =
    document.createElement("div");

  toast.className =
    "toast-msg toast-error";

  toast.innerHTML =
    "❌ " + msg;

  box.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },4000);
}

function previewPDFName() {

  const file =
    document.getElementById("awardFile").files[0];

  const preview =
    document.getElementById("pdfPreview");

  if (!file) {
    preview.innerHTML = "";
    return;
  }

  preview.innerHTML = `
    <i class="fa-solid fa-file-pdf text-danger"></i>
    ${file.name}
  `;
}
