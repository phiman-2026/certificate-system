<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMS Digital Honor App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
<style>
:root{
    --pms-main:#00688B;
    --pms-dark:#004d66;
    --bg-app:#f0f4f7;
    --bg-surface:#ffffff;
    --text-main:#0f172a;
    --text-sub:#475569;
    --border-color:#e2e8f0;
    --global-radius:18px;
}

/* =========================
   GLOBAL
========================= */
body{
    font-family:'Prompt',sans-serif;
    background:var(--bg-app);
    color:var(--text-main);
    margin:0;
    padding:0;
    min-height:100vh;
}

.d-none{
    display:none!important;
}

.content-limiter{
    max-width:1200px;
    margin:0 auto;
    padding:0 16px;
}

.app-container{
    width:100%;
    min-height:100vh;
    padding-top:140px;
    padding-bottom:95px;
    background:#f5f7fb;
}

@media(min-width:768px){
    .app-container{
        padding-top:140px;
    }
}

/* =========================
   HEADER
========================= */
.app-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:1000;

    background:
        linear-gradient(
            rgba(0,104,139,.95),
            rgba(0,104,139,.95)
        ),
        url('https://raw.githubusercontent.com/phiman-2026/picture/main/phiman.png');

    background-size:cover;
    background-position:center;

    padding:20px 0;

    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-content{
    display:flex;
    justify-content:space-between;
    align-items:center;

    max-width:1200px;
    margin:0 auto;
    padding:0 20px;
}

.app-brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.app-logo{
    width:50px;
    height:50px;
    object-fit:contain;
}

.app-title h1{
    margin:0;
    color:#fff;
    font-size:1.2rem;
    font-weight:700;
}

.app-title p{
    margin:0;
    color:#e0f2fe;
    font-size:.8rem;
}

/* =========================
   SEARCH FILTER
========================= */
.filter-trigger-wrapper{
    text-align:center;
    margin:15px;
}

#filter-box-container{
    background:#fff;
    padding:20px;
    border-radius:12px;
    border:1px solid #cbd5e1;
    margin:20px auto;
    max-width:1200px;
    box-shadow:0 4px 6px rgba(0,0,0,.05);
}

#filter-box{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    align-items:center;
}

.filter-select-box{
    min-width:200px;
    padding:10px 15px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    background:#f8fafc;
    color:#334155;
    font-size:.9rem;
}

@media(max-width:767px){
    #filter-box-container{
        display:none;
    }
}

@media(min-width:768px){
    .filter-trigger-wrapper{
        display:none;
    }

    #filter-box-container{
        display:block!important;
    }
}

/* =========================
   WELCOME SCREEN
========================= */
.welcome-screen{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;

    min-height:calc(100vh - 200px);
    padding:20px;
}

.welcome-card{
    width:92%;
    max-width:1000px;

    background:
        linear-gradient(
            rgba(255,255,255,.30),
            rgba(255,255,255,.30)
        ),
        url('https://raw.githubusercontent.com/phiman-2026/picture/main/Picindex.png');

    background-size:cover;
    background-position:center;

    border-radius:35px;
    padding:40px 25px;

    box-shadow:0 15px 35px rgba(0,104,139,.15);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    border:1px solid rgba(0,104,139,.10);
}

.welcome-img{
    width:100px;
    margin-bottom:20px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

.w-line-1{
    font-size:.95rem;
    letter-spacing:4px;
    color:var(--pms-main);
    font-weight:800;
}

.w-line-2{
    font-size:1.8rem;
    font-weight:900;
    color:#1e293b;
    margin:15px 0;
}

.w-line-3{
    font-size:1.15rem;
    color:#475569;
    margin-bottom:35px;
}

.w-line-4{
    display:inline-block;
    background:var(--pms-main);
    color:#fff;
    padding:14px 30px;
    border-radius:50px;
    font-weight:700;
    box-shadow:0 10px 20px rgba(0,104,139,.30);
}

.w-line-5{
    font-size:.85rem;
    color:#94a3b8;
}

@media(min-width:768px){

    .welcome-card{
        padding:60px;
    }

    .welcome-img{
        width:130px;
    }

    .w-line-2{
        font-size:2.8rem;
    }

    .w-line-3{
        font-size:1.4rem;
    }
}

/* =========================
   SECTION TITLE
========================= */
.section-title{
    display:flex;
    align-items:center;
    gap:12px;

    color:#fff;
    font-weight:800;

    padding:12px 16px;
    margin:25px 0 15px;

    border-radius:12px;

    font-size:1.1rem;

    box-shadow:0 4px 12px rgba(0,0,0,.10);
}

.section-title i{
    width:36px;
    height:36px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:rgba(255,255,255,.2);

    border:1px solid rgba(255,255,255,.3);
}

@media(min-width:768px){

    .section-title{
        font-size:1.35rem;
        padding:16px 24px;
        margin:40px 0 25px;
    }

    .section-title i{
        width:42px;
        height:42px;
    }
}

.section-title.school{
    background:linear-gradient(135deg,#1565C0,#0D47A1);
}

.section-title.staff{
    background:linear-gradient(135deg,#00838F,#006064);
}

.section-title.student{
    background:linear-gradient(135deg,#EF6C00,#E65100);
}

/* =========================
   CARD
========================= */
.app-card{
    position:relative;

    background:#fff;

    border-radius:24px;
    border:none;

    padding:18px;

    overflow:hidden;

    box-shadow:0 4px 12px rgba(0,0,0,.05);

    transition:.25s;

    height:100%;
}

.app-card:hover{
    transform:translateY(-5px);
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.app-card::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            rgba(255,255,255,.90),
            rgba(255,255,255,.90)
        ),
        url('https://raw.githubusercontent.com/phiman-2026/picture/main/phiman.png');

    background-size:cover;
    background-position:center;

    z-index:1;
}

.app-card::after{
    content:"";

    position:absolute;
    right:12px;
    bottom:12px;

    width:70px;
    height:70px;

    background-image:url('https://cdn.jsdelivr.net/gh/phiman-2026/picture@main/logo%20phiman.png');
    background-size:contain;
    background-repeat:no-repeat;

    opacity:.12;

    z-index:1;
}

.app-card > *{
    position:relative;
    z-index:2;
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.card-title{
    font-size:1rem;
    font-weight:700;
    line-height:1.5;

    margin-top:10px;
    margin-bottom:14px;

    padding-left:12px;

    border-left:4px solid;
    color:#263238;
}

.info-row{
    display:flex;
    margin-bottom:8px;
    font-size:.85rem;
}

.info-row span{
    width:70px;
    flex-shrink:0;
    font-weight:600;
    color:#546E7A;
}

.info-row b{
    color:#263238;
}

/* =========================
   CARD COLORS
========================= */
.app-card.school .card-title{
    border-left-color:#1565C0;
}

.app-card.staff .card-title{
    border-left-color:#00838F;
}

.app-card.student .card-title{
    border-left-color:#EF6C00;
}

/* =========================
   BADGE
========================= */
.app-badge{
    display:inline-block;
    padding:4px 12px;

    border-radius:20px;

    color:#fff;
    font-size:.9rem;
    font-weight:500;

    margin-bottom:10px;
}

.b-school{
    background:#1565C0;
}

.b-staff{
    background:#00838F;
}

.b-student{
    background:#EF6C00;
}

/* =========================
   BUTTON
========================= */
.btn-app-action{
    width:100%;
    margin-top:12px;

    padding:10px;

    border:none;
    border-radius:10px;

    color:#fff;
    font-weight:700;

    cursor:pointer;
}

.app-card.school .btn-app-action{
    background:linear-gradient(135deg,#1565C0,#0D47A1);
}

.app-card.staff .btn-app-action{
    background:linear-gradient(135deg,#00838F,#006064);
}

.app-card.student .btn-app-action{
    background:linear-gradient(135deg,#EF6C00,#E65100);
}

/* =========================
   REWARD BADGE
========================= */
.reward-badge-ribbon{
    position:absolute;
    top:15px;
    right:-5px;

    background:linear-gradient(135deg,#FF9800,#F57C00);

    color:#fff;

    padding:6px 15px;

    border-radius:15px 0 0 15px;

    font-size:.8rem;
    font-weight:700;

    z-index:10;
}

/* =========================
   EMPTY STATE
========================= */
.empty-state-box{
    text-align:center;
    padding:50px 20px;

    background:#fff;

    border-radius:var(--global-radius);

    border:1px dashed var(--border-color);

    color:var(--text-sub);
}

.empty-state-box i{
    font-size:2.5rem;
    color:#cbd5e1;
}

/* =========================
   FAB
========================= */
.fab-btn{
    position:fixed;
    right:20px;
    bottom:95px;

    width:56px;
    height:56px;

    border:none;
    border-radius:50%;

    background:#ff4500;
    color:#fff;

    font-size:1.5rem;

    z-index:999;

    box-shadow:0 6px 20px rgba(255,69,0,.4);
}

@media(min-width:768px){
    .fab-btn{
        display:none!important;
    }
}

/* =========================
   PC ADD BUTTON
========================= */
.pc-add-btn{
    display:none;

    background:#ff4500;
    color:#fff;

    border:none;
    border-radius:12px;

    padding:10px 18px;

    font-weight:600;
}

@media(min-width:768px){
    .pc-add-btn{
        display:inline-flex;
        align-items:center;
        gap:8px;
    }
}

/* =========================
   SHEET
========================= */
.app-sheet{
    position:fixed;
    inset:0;

    background:#fff;

    z-index:1100;

    overflow-y:auto;
}

.sheet-header{
    background:var(--pms-main);
    color:#fff;

    padding:25px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.sheet-body{
    padding:24px;
}

/* =========================
   BOTTOM NAV
========================= */
.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    height:70px;

    background:#fff;

    border-top:1px solid #e5e7eb;

    box-shadow:0 -2px 12px rgba(0,0,0,.05);
}

.bottom-nav-container{
    display:flex;
    justify-content:space-around;

    max-width:1200px;
    margin:0 auto;
}

.nav-item{
    width:22%;

    border:none;
    background:none;

    padding:8px 0;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;

    color:#94a3b8;
    font-size:.75rem;
}

.nav-item i{
    font-size:1.4rem;
}

.nav-item.active{
    color:var(--pms-main);
    font-weight:700;
}

/* =========================
   VIEWER
========================= */
.app-viewer-modal{
    position:fixed;
    inset:0;

    background:#000;

    z-index:1200;
}

.viewer-header{
    background:var(--pms-main);
    color:#fff;

    padding:15px;

    display:flex;
    justify-content:space-between;
}

/* =========================
   OTHER
========================= */
#statusNotifyModal{
    z-index:2000!important;
}

.award-icon{
    color:#FFD54F;
    font-size:1.3rem;
}

.mobile-app-header{
    position:fixed;
    top:0;
    left:0;
    right:0;

    z-index:1000;

    background:#fff;

    display:flex;
    align-items:center;
    gap:12px;

    padding:12px 15px;

    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.header-logo img{
    width:42px;
    height:42px;
    object-fit:contain;
}

.header-search{
    flex:1;

    display:flex;
    align-items:center;
    gap:10px;

    background:#f3f4f6;

    border-radius:16px;

    padding:10px 14px;
}

.header-search i{
    color:#6b7280;
}

.header-search input{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
}

.header-add-btn{
    width:42px;
    height:42px;

    border:none;
    border-radius:14px;

    background:#8B0000;
    color:#fff;

    font-size:18px;

    box-shadow:0 4px 10px rgba(139,0,0,.25);
}

.search-placeholder{
    color:#6b7280;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
</style>
</head>
<body>

    <div class="app-container">
        
<div class="mobile-app-header">

    <div class="header-logo">
        <img src="https://raw.githubusercontent.com/phiman-2026/picture/main/logo%20phiman.png" alt="Logo">
    </div>

    <div class="header-search" onclick="openSearchScreen()">
        <i class="fa-solid fa-search"></i>
        <div class="search-placeholder">
            ค้นหารางวัล...
        </div>
    </div>

    <button class="header-add-btn" onclick="openAppSheet()">
        <i class="fa-solid fa-plus"></i>
    </button>

</div>
    
         <main class="content-limiter" id="app-main-scroll-zone">
            <div id="dynamic-app-cards-zone">
                
                <div class="welcome-screen" id="welcome-landing-page">
                    <div class="welcome-card">
                        <img src="https://raw.githubusercontent.com/phiman-2026/picture/main/logo%20phiman.png" class="welcome-img" alt="Welcome">
                        <div class="w-line-1">ยินดีต้อนรับเข้าสู่</div>
                        <div class="w-line-2">ระบบจัดเก็บผลงานรางวัลเกียรติยศ</div>
                        <div class="w-line-3">โรงเรียนพิมานพิทยาสรรค์</div>
                        <div class="w-line-4">กรุณาเลือกประเภทรางวัลที่เมนูด้านล่าง</div>
                        <div class="w-line-5">เพื่อเริ่มต้นการเข้าชมค่ะ</div>
                    </div>
                </div>

            </div>
        </main>

        <div id="app-sheet-form" class="app-sheet d-none">
            <div class="sheet-header">
                <h2><i class="fa-solid fa-plus-circle me-1"></i> บันทึกรางวัลใหม่</h2>
                <button class="btn-close" onclick="closeAppSheet()"></button>
            </div>
            <div class="sheet-body">
                <form id="main-honor-form" onsubmit="event.preventDefault();">
                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label small fw-bold">ประเภทรางวัล</label>
                            <select id="form-type" class="form-select" onchange="handleFormTypeChange()">
                                <option value="school">รางวัลสถานศึกษา</option>
                                <option value="staff">รางวัลครูและบุคลากร</option>
                                <option value="student" selected>รางวัลนักเรียน</option>
                            </select>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
    <label class="form-label small fw-bold">ระดับรางวัล</label>
    <select id="form-reward-level" class="form-select">
        <option value="ระดับโรงเรียน">ระดับโรงเรียน</option>
        <option value="ระดับเขตพื้นที่">ระดับเขตพื้นที่</option>
        <option value="ระดับจังหวัด">ระดับจังหวัด</option>
        <option value="ระดับภาค">ระดับภาค</option>
        <option value="ระดับชาติ">ระดับชาติ</option>
        <option value="ระดับนานาชาติ">ระดับนานาชาติ</option>
    </select>
</div>
                        <div class="col-12 col-md-6 mb-3" id="form-dept-container">
                            <label class="form-label small fw-bold">กลุ่มสาระการเรียนรู้ / ฝ่ายงาน</label>
                            <select id="form-dept" class="form-select">
                                <option value="วิทยาศาสตร์ฯ">วิทยาศาสตร์และเทคโนโลยี</option>
                                <option value="คณิตศาสตร์">คณิตศาสตร์</option>
                                <option value="ภาษาไทย">ภาษาไทย</option>
                                <option value="ภาษาต่างประเทศ">ภาษาต่างประเทศ</option>
                                <option value="สังคมศึกษาฯ">สังคมศึกษา ศาสนา และวัฒนธรรม</option>
                                <option value="สุขศึกษาฯ">สุขศึกษาและพลศึกษา</option>
                                <option value="ศิลปะ">ศิลปะ (ดนตรี/นาฏศิลป์)</option>
                                <option value="การงานอาชีพ">การงานอาชีพ</option>
                                <option value="กิจกรรมพัฒนาผู้เรียน">กิจกรรมพัฒนาผู้เรียน (แนะแนว/ลูกเสือฯ)</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-4 mb-3">
                            <label class="form-label small fw-bold">ปีการศึกษา (พ.ศ.)</label>
                            <input type="number" id="form-year" class="form-control" value="2569">
                        </div>
                        <div class="col-12 col-md-8 mb-3">
                            <label class="form-label small fw-bold">หน่วยงานผู้มอบรางวัล</label>
                            <input type="text" id="form-giver" class="form-control" placeholder="หน่วยงานผู้มอบเกียรติบัตร">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">ชื่อรางวัลเต็ม / ผลงานเกียรติยศ</label>
                        <input type="text" id="form-title" class="form-control" placeholder="ระบุชื่อผลงานรางวัลเกียรติยศ">
                    </div>

                    <div class="mb-3" id="form-name-container">
                        <label class="form-label small fw-bold" id="form-name-label">รายชื่อผู้รับรางวัล <span class="text-primary">(หากเป็นประเภททีม ให้ใช้เครื่องหมายคอมมา , คั่นรายชื่อ)</span></label>
                        <textarea id="form-name" class="form-control" rows="3" placeholder="ตัวอย่าง: นายสมชาย รักดี, นางสาวสมหญิง เรียนดี"></textarea>
                    </div>

                    <div class="mb-3" id="form-class-container">
    <label class="form-label small fw-bold">ระดับชั้น / ห้องเรียน</label>
    <input type="text" id="form-class" class="form-control" placeholder="ตัวอย่าง: ม.4/1, ม.6/2">
</div>

                    <div class="mb-4">
                        <label class="form-label text-danger small fw-bold"><i class="fa-solid fa-file-pdf"></i> แนบไฟล์เกียรติบัตร (PDF เท่านั้น)</label>
                        <input type="file" id="form-file" class="form-control" accept="application/pdf">
                    </div>

                    <div class="row g-2 justify-content-end pt-2">
                        <div class="col-6 col-md-3">
                            <button type="button" class="btn btn-light w-100 py-2 fw-bold" onclick="closeAppSheet()">ยกเลิก</button>
                        </div>
                        <div class="col-6 col-md-4">
                            <button id="btn-submit-save" type="button" class="btn btn-primary w-100 py-2 fw-bold" style="background:var(--pms-main)" onclick="uploadAndSave()">บันทึกข้อมูล</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

<div id="search-screen" class="search-screen d-none">
<div class="search-header">
    <button type="button" class="search-back-btn" onclick="closeSearchScreen()">

        configs.forEach(config => {

    function filterAppItems(items, type){

    const yearVal =
    document.getElementById('filter-year').value;

    const levelVal =
    document.getElementById('filter-reward-level').value;

    const deptVal =
    document.getElementById('app-dept-select').value;

    const searchText =
    document.getElementById('search-input')
    ?.value
    ?.toLowerCase() || '';

    return items.filter(item=>{

        const awardTitle =
        (item['ชื่อรางวัล/ผลงานเกียรติยศ'] || '')
        .toLowerCase();

        const person =
        (
            item['ชื่อ-นามสกุลนักเรียนที่ได้รับรางวัล']
            ||
            item['ชื่อ-นามสกุลของคุณครู / บุคลากรผู้ได้รับรางวัล']
            ||
            ''
        ).toLowerCase();

        const giver =
        (
            item['หน่วยงานผู้มอบรางวัล']
            ||
            ''
        ).toLowerCase();

        const matchSearch =
        !searchText
        ||
        awardTitle.includes(searchText)
        ||
        person.includes(searchText)
        ||
        giver.includes(searchText);

        const matchYear =
        yearVal==='all'
        ||
        String(item['ปีการศึกษา'])===yearVal;

        const matchLevel =
        levelVal==='all'
        ||
        item['ระดับรางวัล']===levelVal;

        const matchDept =
        deptVal==='all'
        ||
        (
            item['กลุ่มสาระ']
            ||
            item['กลุ่มสาระการเรียนรู้']
            ||
            item['ฝ่ายงาน']
        )===deptVal;

        return (
            matchSearch
            &&
            matchYear
            &&
            matchLevel
            &&
            matchDept
        );
    });
}

  function buildAppCards(rowContainer, items, type, typeLabel, badgeClass) {

        let className = item['ระดับชั้น'] || item['ชั้นเรียน'] || '';

        let dept = item['กลุ่มสาระ'] || item['กลุ่มสาระการเรียนรู้'] || item['ฝ่ายงาน'] || '';
        let rewardLevel = item['ระดับรางวัล'] || '-';
        const awardTitle = item['ชื่อรางวัล/ผลงานเกียรติยศ'] || 'ไม่มีชื่อรางวัล';
        const year = item['ปีการศึกษา'] || '-';

        const cardHtml = `

                <div class="app-card ${type}" style="position: relative; overflow: hidden;">
                    
                    <div style="position: absolute; top: 15px; right: -5px; background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%); color: #5D4037; padding: 6px 15px; border-radius: 15px 0 0 15px; font-size: 0.8rem; font-weight: 800; box-shadow: 0 4px 6px rgba(0,0,0,0.15); z-index: 10; border: 1px solid rgba(255,255,255,0.3);">
                        <i class="fa-solid fa-medal" style="margin-right: 5px;"></i> ${rewardLevel}
                    </div>

                    <div>
                        <div class="card-top">
                            <span class="app-badge ${badgeClass}">
                                ${icon} ${typeLabel} 
                                ${dept ? `<span style="font-weight: normal; opacity: 0.8; margin-left: 5px;">| ${dept}</span>` : ''}
                            </span>
                        </div>

                        <div class="card-title" title="${awardTitle}">
                            ${awardTitle}
                        </div>

                        <div class="meta-box-app">
                            <div class="info-row">
                                <span>ผู้ได้รับ</span>
                                <b>${person}</b>
                            </div>
                            ${className ? `
                            <div class="info-row">
                                <span>ชั้นเรียน</span>
                                <b>${className}</b>
                            </div>` : ''}
                            <div class="info-row">
                                <span>ผู้มอบ</span>
                                <b>${giver}</b>
                            </div>
                            <div class="info-row">
                                <span>ปีการศึกษา</span>
                                <b>${year}</b>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn-app-action" onclick="openAppViewer('${encodeURIComponent(docLink)}')">
                        <i class="fa-regular fa-file-pdf"></i> ดูเกียรติบัตร
                    </button>
                </div>
            </div>
        `;
        rowContainer.insertAdjacentHTML('beforeend', cardHtml);
    });
}

      function showNotification(isSuccess, title, message) {
    const iconContainer = document.getElementById('notify-icon-container');
    document.getElementById('notify-title').innerText = title;
    document.getElementById('notify-message').innerText = message;

    if (isSuccess) {
        iconContainer.innerHTML = `<i class="fa-solid fa-circle-check text-success"></i>`;
        document.getElementById('notify-title').style.color = "#198754";
    } else {
        iconContainer.innerHTML = `<i class="fa-solid fa-circle-xmark text-danger"></i>`;
        document.getElementById('notify-title').style.color = "#dc3545";
    }

    const modalEl = document.getElementById('statusNotifyModal');
    // เพิ่มการตั้งค่า backdrop เพื่อให้คุมการปิดได้ดีขึ้น
    notifyModal = new bootstrap.Modal(modalEl, { backdrop: 'static', keyboard: false });
    notifyModal.show();
}


        function closeNotification() {
    if (notifyModal) {
        notifyModal.hide();
        // คำสั่งด้านล่างนี้จะช่วยลบเงาสีเทาที่ค้างอยู่ออกไปจาก DOM
        const backdrop = document.querySelector('.modal-backdrop');
        if (backdrop) backdrop.remove();
        document.body.classList.remove('modal-open');
        document.body.style = "";
    }
}

    const giver = document.getElementById('form-giver').value.trim();
    const title = document.getElementById('form-title').value.trim();
    const name = document.getElementById('form-name').value.trim();
    const className = document.getElementById('form-class').value.trim();
    const fileInput = document.getElementById('form-file');

    // ตรวจสอบข้อมูลให้ครบถ้วน
    if (!year || !giver || !title || !name || fileInput.files.length === 0) {
        showNotification(false, 'ข้อมูลไม่ครบ', 'กรุณากรอกข้อมูลให้ครบถ้วนก่อนบันทึกค่ะ');
        return;
    }

    btnSubmit.disabled = true;
    btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> กำลังบันทึก...`;

    const reader = new FileReader();
    reader.onload = function(e) {
        const payload = {
            action: "insertReward",
            type: type,
            rewardLevel: rewardLevel, // ส่งค่าระดับรางวัลไปที่ GAS
            dept: (type === 'school') ? 'บริหารงานกลาง' : dept,
            year: year,
            giver: giver,
            title: title,
            name: name,
            className: className,
            fileMimeType: fileInput.files[0].type,
            fileData: e.target.result.split(',')[1]
        };

        fetch(GAS_WEB_APP_URL, { 
            method: 'POST', 
            body: JSON.stringify(payload) 
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === 'success' || response.result === 'success') {
                showNotification(true, 'บันทึกสำเร็จ', 'ข้อมูลถูกบันทึกเรียบร้อยแล้วค่ะ');
                closeAppSheet();
                // โหลดข้อมูลใหม่เพื่ออัปเดตหน้าจอ
                fetch(GAS_WEB_APP_URL)
                    .then(res => res.json())
                    .then(data => {
                        allAwardsData = data;
                        if(currentTab === 'welcome') currentTab = 'all';
                        renderAppContent();
                    });
            } else {
                showNotification(false, 'เกิดข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้');
            }
        })
        .catch(() => showNotification(false, 'ผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้'))
        .finally(() => {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = 'บันทึกข้อมูล';
        });
    };
    reader.readAsDataURL(fileInput.files[0]);
}

        function openAppViewer(encodedUrl) {
    let url = decodeURIComponent(encodedUrl);
    
    if (!url) {
        showNotification(false, 'ไม่พบเอกสาร', 'ขออภัยด้วยค่ะ ไม่พบลิงก์เอกสารเกียรติบัตรสำหรับรางวัลชิ้นนี้ในระบบ');
        return;
    }

    // --- ส่วนที่แก้ไข: แปลงลิงก์ให้เป็นแบบ preview เพื่อให้เปิดใน iframe ได้ ---
    // หากเป็นลิงก์ Google Drive ปกติ ให้เปลี่ยน /view เป็น /preview
    if (url.includes('drive.google.com/file/d/') && url.includes('/view')) {
        url = url.replace('/view', '/preview');
    }
    // หากลิงก์ยังไม่มีคำว่า preview ให้เติมต่อท้าย (กรณีลิงก์สั้นหรือรูปแบบอื่น)
    else if (url.includes('drive.google.com/file/d/') && !url.includes('/preview')) {
        url = url.split('/view')[0] + '/preview';
    }
    // ------------------------------------------------------------------

    document.getElementById('pdfAppFrame').src = url;
    document.getElementById('app-viewer-modal').classList.remove('d-none');
}

        function closeAppViewer() {
            document.getElementById('app-viewer-modal').classList.add('d-none');
            document.getElementById('pdfAppFrame').src = "";
        }

function toggleFilterBox() {
    const box = document.getElementById('filter-box-container');
    if (box.style.display === 'none' || box.style.display === '') {
        box.style.display = 'block';
    } else {
        box.style.display = 'none';
    }
}
