<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ระบบจัดเก็บผลงานรางวัลเกียรติยศ</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root{
    /* ===== หลัก: มารูนเข้ม — สีตราสัญลักษณ์จริงของระบบ (แทนที่ค่าน้ำเงินเดิมที่ไม่ได้ถูกใช้งาน) ===== */
    --primary:#881313;
    --primary-dark:#6b0f0f;
    --primary-darker:#4d0b0b;
    --primary-light:#a83232;
    --primary-50:#fdf3f3;
    --primary-100:#fbe2e2;
    --primary-200:#f3bdbd;

    /* ===== รอง: ทอง/บรอนซ์ — ใช้อย่างจำกัดเพื่อสื่อถึงเกียรติยศ ===== */
    --gold:#B8860B;
    --gold-light:#E0B84D;

    /* ===== กลาง (Neutrals) ===== */
    --bg:#F8FAFC;
    --surface:#FFFFFF;
    --text:#0F172A;
    --text-light:#64748B;
    --text-muted:#94A3B8;
    --border:#E2E8F0;
    --border-strong:#CBD5E1;

    /* ===== ความหมาย (Semantic) ===== */
    --success:#16A34A;
    --danger:#B91C1C;
    --danger-dark:#991B1B;
    --danger-bg:#FEF2F2;
    --info:#2563EB;

    /* ===== สีประจำประเภทรางวัล — โทนอัญมณีเข้ม ให้ความรู้สึกพรีเมียมและกลมกลืนกับสีหลัก ===== */
    --cat-school:#881313;
    --cat-school-dark:#6b0f0f;
    --cat-management:#4B3F72;
    --cat-management-dark:#372E56;
    --cat-staff:#1F5C73;
    --cat-staff-dark:#163F4F;
    --cat-student:#175C40;
    --cat-student-dark:#0F3F2C;

    /* ===== รัศมีขอบ ===== */
    --radius-sm:10px;
    --radius-md:16px;
    --radius-lg:20px;
    --radius-xl:24px;
    --radius:18px;
    --radius-pill:999px;

    /* ===== เงา (แบบ layered/neutral ไม่ทิ้งสีให้ดูขุ่น) ===== */
    --shadow-sm:0px 2px 3px -1px rgba(0,0,0,0.1),0px 1px 0px 0px rgba(25,28,33,0.02),0px 0px 0px 1px rgba(25,28,33,0.08);
    --shadow-md:0px 0px 0px 1px rgba(0,0,0,0.06),0px 1px 1px -0.5px rgba(0,0,0,0.06),0px 3px 3px -1.5px rgba(0,0,0,0.06),0px 6px 6px -3px rgba(0,0,0,0.06),0px 12px 12px -6px rgba(0,0,0,0.06),0px 24px 24px -12px rgba(0,0,0,0.06);
    --shadow-lg:0 2.8px 2.2px rgba(0,0,0,0.034),0 6.7px 5.3px rgba(0,0,0,0.048),0 12.5px 10px rgba(0,0,0,0.06),0 22.3px 17.9px rgba(0,0,0,0.072),0 41.8px 33.4px rgba(0,0,0,0.086),0 100px 80px rgba(0,0,0,0.12);
    --shadow-primary:0 10px 24px -8px rgba(136,19,19,0.45);

    /* ===== จังหวะการเคลื่อนไหว (แรงบันดาลใจจาก Apple: settle แบบนุ่มนวล ไม่ค้าง) ===== */
    --ease-out:cubic-bezier(0.16,1,0.3,1);
    --ease-standard:cubic-bezier(0.4,0,0.2,1);
    --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
}

/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Prompt',sans-serif;
    background:
        radial-gradient(circle at 12% -8%, rgba(136,19,19,0.05), transparent 42%),
        radial-gradient(circle at 92% 6%, rgba(184,134,11,0.045), transparent 38%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
}

.d-none{
    display:none !important;
}

/* =========================
   APP LAYOUT
========================= */
.app-container{
    width:100%;
    min-height:100vh;
    padding-top:85px;
    padding-bottom:95px;
}

.content-wrap{
    max-width:1400px;
    margin:auto;
    padding:15px;
}

/* =========================
   SCROLLBAR
========================= */
::-webkit-scrollbar{
    width:8px;
    height:8px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:var(--border-strong);
    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:var(--text-muted);
}

/* =========================
   LOADING SCREEN
========================= */
.loading-screen {
    position: fixed;
    inset: 0;
    background: #ffffff;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.loading-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 400px;
    text-align: center;
}

.loading-logo {
    width: 90px;
    height: 90px;
    margin-bottom: 20px;
    object-fit: contain;
    animation: logoBreathe 2.4s var(--ease-standard) infinite;
    filter: drop-shadow(0 10px 22px rgba(136,19,19,0.2));
}

.loading-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 20px;
    line-height: 1.5;
}

.loading-bar-container {
    width: 100%;
    max-width: 250px;
    height: 6px;
    background: var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 15px;
}

.loading-bar-progress {
    width: 40%;
    height: 100%;
    background: linear-gradient(90deg, var(--primary-dark), var(--primary), var(--gold-light));
    border-radius: 10px;
    animation: loadingMove 1.5s infinite var(--ease-standard);
}

.loading-sub {
    color: var(--text-light);
    font-size: 0.9rem;
    font-weight: 500;
}

@keyframes loadingMove {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
}

@keyframes logoBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
}

/* =========================
   HEADER: โลโก้ซ้าย | ค้นหากลาง | ปุ่มขวา
========================= */
.mobile-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 75px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    display: flex;
    align-items: center;
    padding: 10px 15px;
    gap: 12px;
    box-shadow: 0 1px 0 rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06);
    z-index: 1000;
}

.logo-box {
    flex-shrink: 0;
}

.logo-box img {
    width: 45px;
    height: 45px;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.12));
}

.system-title {
    display: none !important;
}

.search-box {
    flex: 1;
    height: 42px;
    background: #ffffff !important;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-light);
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color .25s var(--ease-standard), box-shadow .25s var(--ease-standard);
}

.search-box:hover,
.search-box:focus-visible {
    border-color: var(--primary-200);
    box-shadow: 0 0 0 4px var(--primary-50);
    outline: none;
}

.add-btn {
    width: 45px !important;
    height: 45px !important;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--primary) !important;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .18s var(--ease-out), box-shadow .25s var(--ease-standard), background .25s;
    padding: 0 !important;
    box-shadow: var(--shadow-primary);
}

.add-btn:hover {
    background: var(--primary-dark) !important;
    transform: translateY(-2px);
    box-shadow: 0 14px 26px -10px rgba(136,19,19,0.55);
}

.add-btn:active {
    transform: scale(.94);
}

/* =========================
   DESKTOP HEADER (รวมเป็นชุดเดียว — เดิมมี 2 บล็อกซ้ำซ้อน)
========================= */
@media(min-width: 992px) {
    .app-container {
        padding-top: 100px !important;
    }

    .mobile-header {
        height: 90px;
        padding: 0 40px;
        gap: 20px;
        position: fixed;
        background:
            linear-gradient(135deg, rgba(71, 85, 105, 0.92), rgba(32, 20, 20, 0.9)),
            url("https://raw.githubusercontent.com/phiman-2026/picture/main/Picindex.png");
        background-size: cover;
        background-position: center;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    .mobile-header::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--gold-light), var(--primary-light), var(--gold-light), transparent);
        box-shadow: 0 0 12px rgba(136, 19, 19, 0.5);
    }

    .logo-box img {
        width: 50px !important;
        height: 50px !important;
    }

    .system-title {
        display: block !important;
        color: #fff;
        margin-right: 20px;
        white-space: nowrap;
    }

    .system-title h1 { font-size: 1.15rem !important; font-weight: 800 !important; color: #fff !important; margin: 0 !important; line-height: 1.45; }
    .system-title p { font-size: 0.75rem !important; color: rgba(255, 255, 255, 0.82) !important; margin: 0 !important; }

    .search-box {
        flex: 1;
        max-width: 600px;
        height: 45px !important;
        background: rgba(255, 255, 255, 0.14) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        color: #fff !important;
        margin-left: 20px;
    }

    .search-box:hover,
    .search-box:focus-visible {
        background: rgba(255, 255, 255, 0.2) !important;
        border-color: rgba(255, 255, 255, 0.5);
        box-shadow: 0 0 0 4px rgba(255,255,255,0.08);
    }

    .search-box span { color: #fff !important; }

    .header-actions { display: block !important; }

    .add-btn {
        margin-left: auto;
        width: 45px !important;
        height: 45px !important;
        padding: 0 !important;
    }
}

/* =========================
   LOGIN / USER MENU
========================= */
.login-btn {
    height: 42px;
    padding: 0 18px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--primary) !important;
    color: #fff;
    font-weight: 600;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    flex-shrink: 0;
    cursor: pointer;
    box-shadow: var(--shadow-primary);
    transition: transform .18s var(--ease-out), box-shadow .25s var(--ease-standard), background .25s;
}

.login-btn:hover {
    background: var(--primary-dark) !important;
    transform: translateY(-2px);
}

.login-btn:active {
    transform: scale(.95);
}

.user-menu-wrap { position: relative; flex-shrink: 0; }

.user-avatar-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.6);
    overflow: hidden;
    cursor: pointer;
    background: var(--border-strong);
    padding: 0;
    flex-shrink: 0;
    box-shadow: var(--shadow-sm);
    transition: border-color .2s, transform .18s var(--ease-out);
}
.user-avatar-btn:hover { border-color: var(--gold-light); transform: translateY(-1px); }
.user-avatar-btn:active { transform: scale(.94); }
.user-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

.user-dropdown {
    position: absolute;
    top: 52px;
    right: 0;
    background: #fff;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    width: 240px;
    padding: 8px;
    z-index: 2000;
    border: 1px solid var(--border);
    animation: dropdownIn .22s var(--ease-out) both;
    transform-origin: top right;
}
.user-dropdown .ud-head { padding: 10px 12px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.user-dropdown .ud-name { font-weight: 700; font-size: 0.9rem; color: var(--text); }
.user-dropdown .ud-email { font-size: 0.75rem; color: var(--text-light); word-break: break-all; }
.user-dropdown button {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 0.85rem;
    color: #334155;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background .15s;
}
.user-dropdown button:hover { background: var(--primary-50); }
.user-dropdown button.danger { color: var(--danger); }
.user-dropdown button.danger:hover { background: var(--danger-bg); }

.gsi-mount { position: fixed; top: -9999px; left: -9999px; }

.card-owner-actions{
    display: flex;
    gap: 8px;
    margin-top: 8px;
}
.card-owner-actions button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 9px 0;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform .15s var(--ease-out), background .2s;
}
.card-owner-actions button:active { transform: scale(.95); }
.btn-edit-award { background: var(--primary-50); color: var(--primary); }
.btn-edit-award:hover { background: var(--primary-100); }
.btn-delete-award { background: var(--danger-bg); color: var(--danger); }
.btn-delete-award:hover { background: #fde3e3; }

.admin-panel-modal {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.6);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    display:flex; justify-content:center; align-items:center;
    z-index: 999999; padding: 10px;
    animation: overlayFadeIn .25s var(--ease-standard) both;
}
.admin-panel-box {
    width:100%; max-width:480px; max-height:85vh;
    background:#fff; border-radius:var(--radius-xl);
    overflow:hidden; display:flex; flex-direction:column;
    box-shadow: var(--shadow-lg);
    animation: modalPopIn .3s var(--ease-out) both;
}
.admin-panel-box .ap-head {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color:#fff; padding:18px 22px;
    display:flex; justify-content:space-between; align-items:center;
}
.admin-panel-box .ap-head button {
    width:36px; height:36px; border:none; border-radius:50%;
    background:rgba(255,255,255,0.2); color:#fff; cursor:pointer;
    transition: background .2s, transform .15s var(--ease-out);
}
.admin-panel-box .ap-head button:hover { background: rgba(255,255,255,0.32); }
.admin-panel-box .ap-head button:active { transform: scale(.9); }
.admin-panel-box .ap-body { padding:20px; overflow-y:auto; }
.admin-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--bg); }
.admin-row small { display:block; color:var(--text-light); }
.admin-row button { border:none; background:var(--danger-bg); color:var(--danger); border-radius:8px; padding:6px 12px; font-size:0.8rem; cursor:pointer; transition: background .2s; }
.admin-row button:hover { background:#fde3e3; }

/* =========================
   SEARCH SCREEN
========================= */
.search-screen{
    position:fixed;
    inset:0;
    background:var(--bg);
    z-index:3000;
    overflow-y:auto;
    animation: overlayFadeIn .25s var(--ease-standard) both;
}

.search-header{
    position:sticky;
    top:0;
    background:rgba(255,255,255,0.92);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    display:flex;
    gap:10px;
    padding:15px;
    box-shadow:0 2px 15px rgba(0,0,0,.06);
}

.search-header input{
    flex:1;
    height:45px;
    border:1px solid transparent;
    outline:none;
    border-radius:var(--radius-sm);
    background:var(--bg);
    padding:0 15px;
    font-family:inherit;
    font-size:0.95rem;
    transition: border-color .2s, box-shadow .2s, background .2s;
}
.search-header input:focus{
    background:#fff;
    border-color:var(--primary-200);
    box-shadow:0 0 0 4px var(--primary-50);
}

.search-back-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:var(--radius-sm);
    background:var(--bg);
    color:var(--text);
    cursor:pointer;
    transition: background .2s, transform .15s var(--ease-out);
}
.search-back-btn:hover{ background:var(--border); }
.search-back-btn:active{ transform:scale(.92); }

/* FILTER */
.search-filter-panel {
    background: #ffffff;
    border-radius: var(--radius-lg);
    padding: 20px;
    margin: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
}

.filter-group {
    flex: 1;
    min-width: 150px;
}

.filter-select {
    width: 100%;
    padding: 10px 15px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border-strong);
    background: var(--bg);
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    transition: all 0.25s var(--ease-standard);
}

.filter-select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-100);
    outline: none;
    background: #fff;
}

.search-filter-title{
    font-weight:700;
    color:var(--primary);
    margin-bottom:10px;
}

.filter-label{
    display:block;
    margin-top:10px;
    font-size:.9rem;
    font-weight:600;
    color: var(--text);
}

/* =========================
   CARDS GRID
========================= */
.cards-grid {
    display: grid;
    gap: 20px;
    padding: 10px;
    grid-template-columns: 1fr;
}
@media (min-width: 640px)  { .cards-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .cards-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1440px) { .cards-grid { grid-template-columns: repeat(4, 1fr); } }

.empty-box {
    text-align: center;
    padding: 50px;
    font-size: 1.2rem;
    color: var(--text-muted);
}

/* =========================
   หัวข้อหมวด (เดิมไม่มี CSS กำหนดเลย — เพิ่มให้สมบูรณ์)
========================= */
.section-title{
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--text);
    padding: 4px 4px 4px 14px;
    margin: 28px 0 16px;
    position: relative;
    line-height: 1.6;
}
.section-title::before{
    content:"";
    position:absolute;
    left:0; top:2px; bottom:2px;
    width:5px;
    border-radius: var(--radius-pill);
    background: linear-gradient(180deg, var(--primary), var(--gold-light));
}
.section-title:first-child{ margin-top:4px; }
.cards-grid + .section-title{ margin-top:8px; }

/* =========================
   CARD SYSTEM: PREMIUM UI
========================= */
.award-card {
    background: #fff;
    border-radius: 20px;
    padding: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    transition: transform .4s var(--ease-out), box-shadow .4s var(--ease-out), border-color .4s var(--ease-out);
    animation: cardIn .5s var(--ease-out) both;
}

.award-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    border-color: transparent;
    background:
        linear-gradient(#fff, #fff) padding-box,
        linear-gradient(135deg, rgba(136,19,19,.4), rgba(184,134,11,.4) 55%, rgba(136,19,19,.15)) border-box;
}

.cards-grid > .award-card:nth-child(1){ animation-delay: .03s; }
.cards-grid > .award-card:nth-child(2){ animation-delay: .07s; }
.cards-grid > .award-card:nth-child(3){ animation-delay: .11s; }
.cards-grid > .award-card:nth-child(4){ animation-delay: .15s; }
.cards-grid > .award-card:nth-child(5){ animation-delay: .19s; }
.cards-grid > .award-card:nth-child(6){ animation-delay: .23s; }
.cards-grid > .award-card:nth-child(7){ animation-delay: .27s; }
.cards-grid > .award-card:nth-child(8){ animation-delay: .31s; }
.cards-grid > .award-card:nth-child(n+9){ animation-delay: .34s; }

.card-header-img {
    height: 120px;
    display: flex;
    align-items: center;

    color:var(--primary);
}

.tab-item.active::before{
    content:"";
    position:absolute;
    top:6px;
    width:26px;
    height:3px;
    border-radius: var(--radius-pill);
    background: linear-gradient(90deg, var(--primary), var(--gold-light));

    right:20px;

}

    font-weight: 500;

}

}

.toast-error{
    border-left:5px solid var(--danger);

    from{

    to{

<script>
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwN46MA79wQQ6hAlPd5G0GSWhGiPMNO9TtwX2A5IHeeVTtRyfVFpAM7kyDZDnsKtUWhuA/exec";

// ⚠️ ต้องตรงกับ GOOGLE_CLIENT_ID ฝั่ง Code.gs และตั้ง Authorized JavaScript origins
// ให้ตรงกับโดเมนที่ host หน้าเว็บนี้ใน Google Cloud Console
const GOOGLE_CLIENT_ID = "857339235853-gbd7aip7ktrl2ot025q6judnvvdmfoa9.apps.googleusercontent.com";
const SESSION_STORAGE_KEY = "awardsUserSession";

let userSession = null;      // { token, user:{email,name,picture,role}, expiresAt }
let myOwnedIds = { school: [], management: [], staff: [], student: [] };
let isSuperAdmin = false;
let editingContext = null;   // { type, id } เมื่ออยู่ในโหมดแก้ไข

/* =========================
   AUTH: GOOGLE LOGIN
========================= */
function restoreSession() {
  try {
    const raw = sessionStorage.getItem(SESSION_STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed.expiresAt && Date.now() < parsed.expiresAt) {
      userSession = parsed;
    } else {
      sessionStorage.removeItem(SESSION_STORAGE_KEY);
    }
  } catch (e) { /* ข้ามได้ */ }
}

function persistSession() {
  if (userSession) {
    sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(userSession));
  } else {
    sessionStorage.removeItem(SESSION_STORAGE_KEY);
  }
}

function initGoogleLogin() {
  if (typeof google === "undefined" || !google.accounts) {
    setTimeout(initGoogleLogin, 300);
    return;
  }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: false
  });
  google.accounts.id.renderButton(
    document.getElementById("gsiMount"),
    { type: "icon" }
  );
}

function startLogin() {
  if (typeof google === "undefined" || !google.accounts) {
    return Swal.fire({ icon: "error", title: "โหลดระบบ Google Login ไม่สำเร็จ", text: "กรุณาลองรีเฟรชหน้าเว็บอีกครั้ง", confirmButtonColor: "#881313" });
  }
  google.accounts.id.prompt((notification) => {
    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
      // เบราว์เซอร์บล็อก One Tap → คลิกปุ่มที่ซ่อนไว้แทน
      const btn = document.querySelector("#gsiMount div[role=button]");
      if (btn) btn.click();
    }
  });
}

async function handleCredentialResponse(response) {
  Swal.fire({ title: "กำลังเข้าสู่ระบบ...", allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  try {
    const result = await callGas({ action: "googleLogin", idToken: response.credential });
    if (result.status !== "success") throw new Error(result.message || "เข้าสู่ระบบไม่สำเร็จ");

    userSession = {
      token: result.token,
      user: result.user,
      expiresAt: Date.now() + (result.expiresInSec * 1000)
    };
    persistSession();
    Swal.close();
    await afterLoginSetup();
    Swal.fire({ icon: "success", title: "เข้าสู่ระบบสำเร็จ", showConfirmButton: false, timer: 1200 });
  } catch (err) {
    userSession = null;
    persistSession();
    Swal.fire({ icon: "error", title: "เข้าสู่ระบบไม่สำเร็จ", text: err.message, confirmButtonColor: "#881313" });
  }
}

function logout() {
  userSession = null;
  myOwnedIds = { school: [], management: [], staff: [], student: [] };
  isSuperAdmin = false;
  persistSession();
  updateAuthUI();
  toggleUserMenu(false);
  renderDashboard();
}

async function afterLoginSetup() {
  await refreshMyItems();
  updateAuthUI();
  renderDashboard();
}

async function refreshMyItems() {
  if (!userSession) return;
  try {
    const result = await callGas({ action: "myItems", token: userSession.token });
    if (result.status === "success") {
      myOwnedIds = result.ids || myOwnedIds;
      isSuperAdmin = !!result.isSuperAdmin;
    }
  } catch (e) { console.error(e); }
}

function updateAuthUI() {
  const loggedIn = !!userSession;
  document.getElementById("loginArea").classList.toggle("d-none", loggedIn);
  document.getElementById("userMenuArea").classList.toggle("d-none", !loggedIn);
  document.getElementById("quickAddBtn").classList.toggle("d-none", !loggedIn);

  if (loggedIn) {
    document.getElementById("userAvatarImg").src = userSession.user.picture ||
      "https://raw.githubusercontent.com/phiman-2026/picture/main/logo%20phiman.png";
    document.getElementById("udName").textContent = userSession.user.name || userSession.user.email;
    document.getElementById("udEmail").textContent = userSession.user.email;
    document.getElementById("udAdminBtn").classList.toggle("d-none", !isSuperAdmin);
  }
}

function toggleUserMenu(force) {
  const dd = document.getElementById("userDropdown");
  if (typeof force === "boolean") {
    dd.classList.toggle("d-none", !force);
  } else {
    dd.classList.toggle("d-none");
  }
}

document.addEventListener("click", (e) => {
  const wrap = document.getElementById("userMenuArea");
  if (wrap && !wrap.contains(e.target)) toggleUserMenu(false);
});

// ต้อง login ก่อนถึงจะทำรายการได้ (เพิ่ม/แก้ไข/ลบ)
function requireLogin() {
  if (userSession) return true;
  Swal.fire({
    icon: "info",
    title: "กรุณาเข้าสู่ระบบก่อน",
    text: "ต้องเข้าสู่ระบบด้วยบัญชี Google ของโรงเรียน (@phiman.ac.th) ก่อนทำรายการนี้",
    confirmButtonText: "เข้าสู่ระบบ",
    showCancelButton: true,
    cancelButtonText: "ยกเลิก",
    confirmButtonColor: "#881313"
  }).then(res => { if (res.isConfirmed) startLogin(); });
  return false;
}

/* =========================
   GAS API HELPER
========================= */
async function callGas(payload) {
  const res = await fetch(GAS_WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) });
  return res.json();
}

const TYPE_CONFIG = {
  school: { icon: "🏫", color: "#881313", title: "รางวัลสถานศึกษา" },
  management: { icon: "👔", color: "#4B3F72", title: "รางวัลฝ่ายบริหาร" }, // ต้องมีบรรทัดนี้
  staff: { icon: "👨‍🏫", color: "#1F5C73", title: "รางวัลครู" },
  student: { icon: "🎓", color: "#175C40", title: "รางวัลนักเรียน" }
};
      
let filters = {
  year: "all",
  level: "all",
  dept: "all"
};

let currentPage = 1; // สำหรับเก็บเลขหน้า
      
let allAwardsData = {
  school: [],
  staff: [],
  student: []
};

let currentTab = "home";

// ปรับตัวแปรเดิมเป็นแบบนี้
let currentTabFilters = {
  staff: "all",
  student: "all"
};

/* =========================
   INIT
========================= */
async function initApp() {
  showLoadingScreen();
  restoreSession();
  initGoogleLogin();
  try {
    await loadAwards();
    if (userSession) await refreshMyItems();
    updateAuthUI();
    renderHomePage();
  } finally {
    hideLoadingScreen();
  }
}

/* =========================
   LOAD DATA
========================= */
async function loadAwards() {

  try {

    const res = await fetch(GAS_WEB_APP_URL);

    if (!res.ok) {
      throw new Error(`HTTP Error ${res.status}`);
    }

    const data = await res.json();

    allAwardsData = data;

  } catch (err) {

    console.error(err);

    Swal.fire({
      icon: "error",
      title: "โหลดข้อมูลไม่สำเร็จ",
      text: "ไม่สามารถเชื่อมต่อฐานข้อมูลได้",
      confirmButtonColor: "#881313"
    });

  }

}

/* =========================
   LOADING
========================= */
function showLoadingScreen() {
  const loader = document.getElementById("loading-screen");
  loader.style.pointerEvents = "auto";
  loader.style.opacity = "1";
  loader.style.display = "flex";
}

function hideLoadingScreen() {
  const loader = document.getElementById("loading-screen");
  
  // 1. เพิ่ม Transition ให้กับตัว Element (ถ้ายังไม่มีใน CSS)
  loader.style.transition = "opacity 0.5s ease";
  
  // 2. ปิดการรับคลิกทันที กันไม่ให้ชั้นนี้บังปุ่มด้านล่าง (สาเหตุหลักที่กดปุ่มแล้วไม่ค่อยติด)
  loader.style.pointerEvents = "none";
  
  // 3. สั่งให้จางลง
  loader.style.opacity = "0";
  
  // 4. รอให้จางจนมองไม่เห็นแล้วค่อยเอาออกจาก DOM
  setTimeout(() => {
    loader.style.display = "none";
  }, 500); 
}

/* =========================
   HOME
========================= */
function renderHomePage() {
  const zone = document.getElementById("app-content");
  zone.innerHTML = "";

  // ใส่เลข 4 เพื่อจำกัดจำนวนการแสดงผลบนหน้าแรกและให้แสดงปุ่ม "ดูเพิ่มเติม"
  renderSection("school", "รางวัลสถานศึกษา", 4);
  renderSection("management", "รางวัลฝ่ายบริหาร", 4);
  renderSection("staff", "รางวัลครูและบุคลากร", 4);
  renderSection("student", "รางวัลนักเรียน", 4);
}
      
/* =========================
   SECTION + CARDS (MAIN)
========================= */
function renderSection(type, title, limit = null, page = 1) {
  const zone = document.getElementById("app-content");
  let data = (allAwardsData[type] || []).slice().reverse();

  // 1. กรองด้วย Filter หลักของระบบ (ถ้ามีการค้นหาจากหน้าหลัก)
  data = data.filter(item => {
    const yearMatch = filters.year === "all" || item["ปีการศึกษา"] == filters.year;
    const levelMatch = filters.level === "all" || item["ระดับรางวัล"] == filters.level;
    const deptMatch = filters.dept === "all" || (item["กลุ่มสาระการเรียนรู้"] || "") == filters.dept;
    return yearMatch && levelMatch && deptMatch;
  });

  // 2. ถ้าเป็นแท็บครูหรือนักเรียน (ไม่ใช่หน้าแรกที่มี limit) ให้กรองเพิ่มด้วยกลุ่มสาระเฉพาะแท็บ
  if (!limit && (type === "staff" || type === "student")) {
    const currentDeptFilter = currentTabFilters[type] || "all";
    
    // แทรก Dropdown กรองกลุ่มสาระเฉพาะแท็บ (เพิ่ม "บูรณาการ" แล้ว)
    zone.insertAdjacentHTML("beforeend", `
      <div style="margin-bottom: 15px; padding: 0 10px;">
        <select onchange="updateTabFilter('${type}', '${title}', this.value)" style="width: 100%; max-width: 300px; padding: 10px; border-radius: 12px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer;">
          <option value="all" ${currentDeptFilter === 'all' ? 'selected' : ''}>ทุกกลุ่มสาระ</option>
          <option value="ภาษาไทย" ${currentDeptFilter === 'ภาษาไทย' ? 'selected' : ''}>ภาษาไทย</option>
          <option value="คณิตศาสตร์" ${currentDeptFilter === 'คณิตศาสตร์' ? 'selected' : ''}>คณิตศาสตร์</option>
          <option value="วิทยาศาสตร์และเทคโนโลยี" ${currentDeptFilter === 'วิทยาศาสตร์และเทคโนโลยี' ? 'selected' : ''}>วิทยาศาสตร์และเทคโนโลยี</option>
          <option value="สังคมศึกษา ศาสนา และวัฒนธรรม" ${currentDeptFilter === 'สังคมศึกษา ศาสนา และวัฒนธรรม' ? 'selected' : ''}>สังคมศึกษา ศาสนา และวัฒนธรรม</option>
          <option value="ภาษาต่างประเทศ" ${currentDeptFilter === 'ภาษาต่างประเทศ' ? 'selected' : ''}>ภาษาต่างประเทศ</option>
          <option value="สุขศึกษาและพลศึกษา" ${currentDeptFilter === 'สุขศึกษาและพลศึกษา' ? 'selected' : ''}>สุขศึกษาและพลศึกษา</option>
          <option value="ศิลปะ" ${currentDeptFilter === 'ศิลปะ' ? 'selected' : ''}>ศิลปะ</option>
          <option value="การงานอาชีพ" ${currentDeptFilter === 'การงานอาชีพ' ? 'selected' : ''}>การงานอาชีพ</option>
          <option value="กิจกรรมพัฒนาผู้เรียน" ${currentDeptFilter === 'กิจกรรมพัฒนาผู้เรียน' ? 'selected' : ''}>กิจกรรมพัฒนาผู้เรียน</option>
          <option value="บูรณาการ" ${currentDeptFilter === 'บูรณาการ' ? 'selected' : ''}>บูรณาการ</option>
        </select>
      </div>
    `);

    if (currentDeptFilter !== "all") {
      data = data.filter(item => (item["กลุ่มสาระการเรียนรู้"] || "").toString().trim() === currentDeptFilter);
    }
  }

  const totalItems = data.length;
  const itemsPerPage = 20;
  const displayData = limit ? data.slice(0, limit) : data.slice((page - 1) * itemsPerPage, page * itemsPerPage);

  // สร้างโครงสร้าง Section หลัก
  zone.insertAdjacentHTML("beforeend", `
    <div class="section-title">🏆 ${title}</div>
    <div class="cards-grid mb-4" id="row-${type}"></div>
  `);

  const row = document.getElementById(`row-${type}`);

  if (totalItems === 0) {
    row.insertAdjacentHTML("beforeend", `
      <div class="empty-box" style="grid-column: 1/-1; padding: 30px 0; text-align: center; color: #94a3b8; font-weight: 500;">
        <i class="fa-solid fa-folder-open" style="font-size: 2rem; display: block; margin-bottom: 10px;"></i>
        ไม่มีข้อมูลรางวัลนี้
      </div>
    `);
  } else {
    buildCards(row, displayData, type);

    if (limit && totalItems > limit) {
      row.insertAdjacentHTML("afterend", `
        <div class="text-center mb-5">
            <button onclick="changeTab('${type}')" style="background: none; border: 1px solid #881313; color: #881313; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-weight: 600;">
                ดูเพิ่มเติม...
            </button>
        </div>
      `);
    } else if (!limit && totalItems > itemsPerPage) {
      const totalPages = Math.ceil(totalItems / itemsPerPage);
      renderPagination(type, title, totalPages, page);
    }
  }
}

      
// ฟังก์ชันสำหรับรองรับการเปลี่ยน Filter เฉพาะแท็บ
function updateTabFilter(type, title, value) {
  currentTabFilters[type] = value;
  document.getElementById("app-content").innerHTML = "";
  renderSection(type, title, null, 1);
}

// ฟังก์ชันสร้างปุ่มเลขหน้า
function renderPagination(type, title, totalPages, currentPage) {
  const zone = document.getElementById("app-content");
  let html = `<div class="pagination-box" style="text-align:center; margin: 20px 0;">`;
  
  for (let i = 1; i <= totalPages; i++) {
    const isActive = i === currentPage;
    html += `
      <button onclick="goToPage('${type}', '${title}', ${i})" 
              style="margin: 0 5px; padding: 5px 12px; border: 1px solid #881313; cursor: pointer; 
              background-color: ${isActive ? '#881313' : 'transparent'}; 
              color: ${isActive ? 'white' : '#881313'}; border-radius: 4px; font-weight: bold;">
        ${i}
      </button>`;
  }
  html += `</div>`;
  zone.insertAdjacentHTML("beforeend", html);
}

// ฟังก์ชันสำหรับกดเปลี่ยนหน้า
function goToPage(type, title, page) {
  const zone = document.getElementById("app-content");
  zone.innerHTML = ""; // เคลียร์หน้าจอเดิม
  window.scrollTo(0, 0); // เลื่อนขึ้นบนสุด
  renderSection(type, title, null, page); // เรียกเรนเดอร์ใหม่ที่หน้าใหม่
}
      
/* =========================
   CARD BUILDER (สำคัญ)
========================= */
function buildCards(container, data, type) {

  const config = TYPE_CONFIG[type] || TYPE_CONFIG.school;

  data.forEach(item => {

    const title =
      item["ชื่อรางวัล/ผลงานเกียรติยศ"] || "-";

    const year =
      item["ปีการศึกษา"] || "-";

    const level =
      item["ระดับรางวัล"] || "-";

    const giver =
      item["หน่วยงานที่มอบรางวัล"] || "-";

    const dept =
      item["กลุ่มสาระการเรียนรู้"] || "";

    const className =
      item["ชั้นเรียน"] || "";

    const pdfUrl =
      item["ลิงก์ไฟล์เกียรติบัตร"] || "";

    // ดึงรหัสรางวัลจากฐานข้อมูล (ถ้าไม่มีให้เป็นค่าว่าง)
    const awardCode = item["รหัสรางวัล"] || "";

    // เช็คสิทธิ์แก้ไข/ลบ: แอดมินใหญ่ หรือเจ้าของรางวัลเท่านั้น
    const canEdit = !!userSession && (isSuperAdmin || (myOwnedIds[type] || []).includes(awardCode));

    let person = "";

    if (type === "school") {
      person = "โรงเรียนพิมานพิทยาสรรค์";
    }

    if (type === "management") {
      person =
        item["ชื่อ-นามสกุลของผู้ได้รับรางวัล"] || "-";
    }

    if (type === "staff") {
      person =
        item["ชื่อ-นามสกุลของคุณครู / บุคลากรผู้ได้รับรางวัล"] || "-";
    }

    if (type === "student") {
      person =
        item["ชื่อ-นามสกุลนักเรียนที่ได้รับรางวัล"] || "-";
    }

    container.insertAdjacentHTML(
      "beforeend",
      createCardHTML(
        type,
        title,
        person,
        giver,
        year,
        level,
        dept,
        className,
        config,
        pdfUrl,
        awardCode, // ส่งค่ารหัสรางวัลเข้าไปที่ฟังก์ชันสร้าง HTML
        canEdit
      )
    );

  });
}

/* =========================
   CARD HTML
========================= */

        management: 'https://raw.githubusercontent.com/phiman-2026/picture/main/Director.png',
        staff: 'https://raw.githubusercontent.com/phiman-2026/picture/main/Teacher.png',
        student: 'https://raw.githubusercontent.com/phiman-2026/picture/main/student.png'
    };
    
    const headerImg = headerImages[type] || headerImages.school;
    
    // ตั้งค่าสี Badge และปุ่มให้รองรับ management
    const badgeColor = type === 'school' ? '#881313' : (type === 'management' ? '#4B3F72' : (type === 'staff' ? '#1F5C73' : '#175C40'));
    const btnColor = type === 'school' ? '#881313' : (type === 'management' ? '#372E56' : (type === 'staff' ? '#163F4F' : '#0F3F2C'));

    return `
    <div class="award-card">
        <div class="card-header-img" style="background-image: url('${headerImg}'); position: relative;">
            
            <img src="https://raw.githubusercontent.com/phiman-2026/picture/main/logo%20phiman.png" 
                 style="position: absolute; top: 10px; left: 10px; width: 45px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); z-index: 2;">
            
            ${awardCode ? `
            <div style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; z-index: 3;">
                ${awardCode}
            </div>` : ''}
            
            <div class="award-badge-points" style="color: ${badgeColor}; border: 1px solid ${badgeColor}; background: rgba(255,255,255,0.9);">
                ${level}
            </div>
        </div>
        <div class="card-body-content">
            <div class="award-title">${title}</div>
            <div class="award-meta">
                <p><strong>ผู้ได้รับ:</strong> ${person}</p>
                ${className ? `<p><strong>ชั้นเรียน:</strong> ${className}</p>` : ''}
                ${dept ? `<p><strong>กลุ่มสาระ:</strong> ${dept}</p>` : ''}
                <p><strong>หน่วยงานที่มอบ:</strong> ${giver}</p>
                <p><strong>ปีการศึกษา:</strong> ${year}</p>
            </div>
            <button class="btn-view-award" 
                    style="background-color: ${btnColor}" 
                    onclick="openPDF('${pdfUrl}')">
                <i class="fa-solid fa-file-pdf"></i> ดูเกียรติบัตร
            </button>
            ${canEdit ? `
            <div class="card-owner-actions">
                <button class="btn-edit-award" onclick="editAward('${type}', '${awardCode}')">
                    <i class="fa-solid fa-pen"></i> แก้ไข
                </button>
                <button class="btn-delete-award" onclick="deleteAward('${type}', '${awardCode}')">
                    <i class="fa-solid fa-trash"></i> ลบ
                </button>
            </div>` : ''}
        </div>
    </div>`;
}

function searchAwards() {
  const keyword = document.getElementById("search-input").value.toLowerCase().trim();
  const fYear = document.getElementById("filter-year").value;
  const fLevel = document.getElementById("filter-level").value;
  const fDept = document.getElementById("filter-dept").value;

  let result = [];

  ["school", "management", "staff", "student"].forEach(type => {
    (allAwardsData[type] || []).forEach(item => {
      
      // 1. สร้างข้อความสำหรับค้นหา
      const textToSearch = (
        (item["ชื่อรางวัล/ผลงานเกียรติยศ"] || "") + 
        (item["ชื่อ-นามสกุลของคุณครู / บุคลากรผู้ได้รับรางวัล"] || "") + 
        (item["ชื่อ-นามสกุลนักเรียนที่ได้รับรางวัล"] || "") +
        (item["ชื่อ-นามสกุลของผู้ได้รับรางวัล"] || "") + 
        (item["หน่วยงานที่มอบรางวัล"] || "")
      ).toLowerCase();

      // 2. เช็คเงื่อนไข Filter
      // เพิ่ม .toString().trim() เพื่อป้องกัน Error และช่องว่างที่ไม่ตั้งใจในฐานข้อมูล
      const matchYear = (fYear === "all" || (item["ปีการศึกษา"] || "").toString().trim() == fYear);
      const matchLevel = (fLevel === "all" || (item["ระดับรางวัล"] || "").toString().trim() == fLevel);
      const matchDept = (fDept === "all" || (item["กลุ่มสาระการเรียนรู้"] || "").toString().trim() == fDept);

      // 3. เช็คเงื่อนไข keyword
      const matchKeyword = (keyword === "" || textToSearch.includes(keyword));

      // ถ้าผ่านทุกเงื่อนไข ให้เก็บข้อมูล
      if (matchKeyword && matchYear && matchLevel && matchDept) {
        result.push({ type, item });
      }
    });
  });

  renderSearchResult(result);
}

/* =========================
   SEARCH RESULT
========================= */
function renderSearchResult(result) {
    const zone = document.getElementById("search-result-container");
    
    if (result.length === 0) {
        zone.innerHTML = `<div class="empty-box">🔍 ไม่พบข้อมูลที่ค้นหา</div>`;
        return;
    }

    // สร้าง Grid Container ขึ้นมาใหม่
    // เปลี่ยนบรรทัดนี้
    zone.innerHTML = `<div class="cards-grid" id="search-grid"></div>`;
    const grid = document.getElementById("search-grid");

    // ใช้ buildCards ของเดิม แต่เปลี่ยนที่วางไปที่ grid
    result.forEach(obj => {
        buildCards(grid, [obj.item], obj.type);
    });
}

function editAward(type, id) {
  if (!requireLogin()) return;

  const item = (allAwardsData[type] || []).find(a => (a["รหัสรางวัล"] || "") === id);
  if (!item) return Swal.fire({ icon: "error", title: "ไม่พบข้อมูลรางวัลนี้", confirmButtonColor: "#881313" });

  editingContext = { type, id };
  document.getElementById("awardFormTitle").textContent = "แก้ไขรางวัล";
  document.getElementById("awardForm").reset();
  document.getElementById("pdfPreview").innerHTML = "";
  document.getElementById("awardFile").required = false; // ไม่บังคับแนบไฟล์ใหม่ตอนแก้ไข

  document.getElementById("awardType").value = type;
  document.getElementById("awardType").disabled = true; // ไม่ให้เปลี่ยนประเภทตอนแก้ไข
  changeAwardType();

  document.getElementById("awardYear").value = item["ปีการศึกษา"] || "";
  document.getElementById("awardLevel").value = item["ระดับรางวัล"] || "";
  document.getElementById("awardTitle").value = item["ชื่อรางวัล/ผลงานเกียรติยศ"] || "";
  document.getElementById("awardGiver").value = item["หน่วยงานที่มอบรางวัล"] || "";

  if (type === "management") {
    const el = document.getElementById("awardPerson");
    if (el) el.value = item["ชื่อ-นามสกุลของผู้ได้รับรางวัล"] || "";
  } else if (type === "staff") {
    const el = document.getElementById("awardPerson");
    if (el) el.value = item["ชื่อ-นามสกุลของคุณครู / บุคลากรผู้ได้รับรางวัล"] || "";
    document.getElementById("awardDept").value = item["กลุ่มสาระการเรียนรู้"] || "";
  } else if (type === "student") {
    const el = document.getElementById("awardPerson");
    if (el) el.value = item["ชื่อ-นามสกุลนักเรียนที่ได้รับรางวัล"] || "";
    const classEl = document.getElementById("awardClass");
    if (classEl) classEl.value = item["ชั้นเรียน"] || "";
    document.getElementById("awardDept").value = item["กลุ่มสาระการเรียนรู้"] || "";
  }

  document.getElementById("awardFormModal").classList.remove("d-none");
  document.body.style.overflow = "hidden";
}

async function deleteAward(type, id) {

  const confirmResult = await Swal.fire({
    icon: "warning",
    title: "ยืนยันการลบรางวัล",

    showCancelButton: true,
    confirmButtonText: "ลบ",

    const result = await callGas({ action: "delete", token: userSession.token, type, id });

async function saveAward() {
  if (!requireLogin()) return;

  const btn = document.getElementById("btn-save");
  const isEdit = !!editingContext;

  // =====================
  // 1. ดึงข้อมูลจากฟอร์ม
  // =====================
  const type = document.getElementById("awardType").value;
  const year = document.getElementById("awardYear").value.trim();
  const dept = document.getElementById("awardDept").value.trim();
  const rewardLevel = document.getElementById("awardLevel").value.trim();
  const title = document.getElementById("awardTitle").value.trim();
  const giver = document.getElementById("awardGiver").value.trim();
  const file = document.getElementById("awardFile").files[0];

  let name = "";
  let className = "";

  // =====================
  // 2. VALIDATION (ตอนแก้ไข ไม่บังคับแนบไฟล์ใหม่)
  // =====================
  if (!year || !rewardLevel || !title || !giver || (!isEdit && !file)) {
    return Swal.fire({
      icon: "warning",
      title: "ข้อมูลไม่ครบ",
      text: "กรุณากรอกข้อมูลให้ครบ" + (isEdit ? "" : "และแนบไฟล์ PDF"),
      confirmButtonColor: "#881313"
    });
  }

  // กรณีฝ่ายบริหาร (เพิ่มใหม่)
  if (type === "management") {
    name = document.getElementById("awardPerson")?.value.trim() || "";
    if (!name) return Swal.fire({ icon: "warning", title: "ข้อมูลไม่ครบ", text: "กรุณากรอกชื่อ-นามสกุลของผู้ได้รับรางวัล", confirmButtonColor: "#881313" });
  }

  // กรณีครู
  if (type === "staff") {
    name = document.getElementById("awardPerson")?.value.trim() || "";
    if (!name || !dept) return Swal.fire({ icon: "warning", title: "ข้อมูลไม่ครบ", text: "กรุณากรอกชื่อครูและเลือกกลุ่มสาระ", confirmButtonColor: "#881313" });
  }

  // กรณีนักเรียน
  if (type === "student") {
    name = document.getElementById("awardPerson")?.value.trim() || "";
    className = document.getElementById("awardClass")?.value.trim() || "";
    if (!name || !className || !dept) return Swal.fire({ icon: "warning", title: "ข้อมูลไม่ครบ", text: "กรุณากรอกชื่อนักเรียน ชั้นเรียน และกลุ่มสาระ", confirmButtonColor: "#881313" });
  }

  if (file) {
    if (file.type !== "application/pdf") return Swal.fire({ icon: "error", title: "ไฟล์ไม่ถูกต้อง", text: "อนุญาตเฉพาะไฟล์ PDF เท่านั้น", confirmButtonColor: "#881313" });
    if (file.size > 10 * 1024 * 1024) return Swal.fire({ icon: "error", title: "ไฟล์ใหญ่เกินกำหนด", text: "ขนาดไฟล์ต้องไม่เกิน 10 MB", confirmButtonColor: "#881313" });
  }

  // =====================
  // 3. เริ่มบันทึกข้อมูล
  // =====================
  Swal.fire({
    title: "กำลังบันทึกข้อมูล",
    text: "กรุณารอสักครู่...",
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...`;

  try {
    const payload = {
      action: isEdit ? "update" : "create",
      token: userSession.token,
      type, year, rewardLevel, title, giver, name, dept, className
    };
    if (isEdit) payload.id = editingContext.id;
    if (file) {
      payload.fileData = await convertFileToBase64(file);
      payload.fileMimeType = file.type;
    }

    const result = await callGas(payload);

    if (result.status !== "success") throw new Error(result.message || "เกิดข้อผิดพลาด");

    // --- ลำดับการปิดฟอร์ม ---
    closeAwardForm();

    // เคลียร์ค่าในฟอร์ม
    document.getElementById("awardForm").reset();
    document.getElementById("pdfPreview").innerHTML = "";
    changeAwardType();

    // แสดงแจ้งเตือน
    await Swal.fire({
      icon: "success",
      title: isEdit ? "แก้ไขรางวัลสำเร็จ" : "บันทึกรางวัลสำเร็จ",
      showConfirmButton: false,
      timer: 1500
    });

    // รีเฟรชข้อมูล
    await loadAwards();
    await refreshMyItems();
    if (currentTab === "home") {
      renderHomePage();
    } else {
      changeTab(currentTab);
    }

  } catch (err) {
    console.error(err);
    Swal.fire({ icon: "error", title: "บันทึกไม่สำเร็จ", text: err.message, confirmButtonColor: "#881313" });
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> บันทึก`;
  }
}

      
function convertFileToBase64(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {

      const base64 =
        reader.result.split(",")[1];

      resolve(base64);
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

async function deleteAdminUI(email) {

    showCancelButton: true, confirmButtonText: "ลบ", cancelButtonText: "ยกเลิก", confirmButtonColor: "#b91c1c"
  });
  if (!confirmResult.isConfirmed) return;

  try {
    const result = await callGas({ action: "deleteAdmin", token: userSession.token, email });
    if (result.status !== "success") throw new Error(result.message || "ลบไม่สำเร็จ");
    loadAdminList();
  } catch (err) {
    Swal.fire({ icon: "error", title: "ลบไม่สำเร็จ", text: err.message, confirmButtonColor: "#881313" });
  }
}

function setFilter(type, value) {
  filters[type] = value;
  renderHomePage(); // รีโหลดหน้าหลัก
}

function resetFilters() {
  filters = { year: "all", level: "all", dept: "all" };
  renderHomePage();
}

function showSuccessPopup(){

function previewPDFName() {

  const file =
    document.getElementById("awardFile").files[0];

  const preview =
    document.getElementById("pdfPreview");

  if (!file) {
    preview.innerHTML = "";
    return;
  }

  preview.innerHTML = `
    <i class="fa-solid fa-file-pdf text-danger"></i>
    ${file.name}
  `;
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", () => {
    // เช็คว่าอยู่ใน Session ปัจจุบันหรือไม่ ถ้าเคยปิดแถบไปแล้วจะไม่แสดงอีกจนกว่าจะโหลดหน้าใหม่
    if (sessionStorage.getItem('hideLineNotice') === 'true') {
        document.getElementById('line-notice').style.display = 'none';
    } else {
        checkLineBrowser(); 
    }
    
    initApp();
});

// ฟังก์ชันสำหรับปิดแถบและจำค่าไว้แค่ใน Session ปัจจุบัน
function hideNoticePermanently() {
    document.getElementById('line-notice').style.display = 'none';
    sessionStorage.setItem('hideLineNotice', 'true');
}

// ฟังก์ชันเปิดใน Browser (สำหรับ Android/iOS)
function openInBrowser() {
    const url = window.location.href;
    const isAndroid = navigator.userAgent.toLowerCase().indexOf("android") > -1;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (isAndroid) {
        window.location.href = "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
    } else if (isIOS) {
        alert("บน iPhone/iPad: กรุณากดปุ่ม 3 จุด (⋯) ที่มุมขวาบน แล้วเลือก 'เปิดใน Safari' เพื่อใช้งานฟังก์ชันเต็มรูปแบบครับ");
    } else {
        window.open(url, '_blank');
    }
}

// ฟังก์ชันตรวจว่าเปิดผ่าน LINE หรือไม่
function checkLineBrowser() {
    const ua = navigator.userAgent.toLowerCase();
    const isLine = ua.indexOf("line") > -1;
    if (isLine) {
        document.getElementById("line-notice").style.display = "block";
    }
}
