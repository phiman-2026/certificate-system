<style>

:root{

    --primary:#8B0000;
    --primary-dark:#650000;

    --gold:#D4AF37;

    --blue:#0B5ED7;

    --bg:#F4F7FA;

    --surface:#FFFFFF;

    --text:#1E293B;

    --text-light:#64748B;

    --border:#E2E8F0;

    --radius:24px;

}

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:'Prompt',sans-serif;

    background:var(--bg);

    color:var(--text);

    min-height:100vh;

    overflow-x:hidden;
}

.d-none{
    display:none !important;
}

.app-container{

    width:100%;

    min-height:100vh;

    padding-top:85px;

    padding-bottom:90px;
}

.content-wrap{

    width:100%;

    max-width:1400px;

    margin:auto;

    padding:15px;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#CBD5E1;
    border-radius:20px;
}

/* =========================
   LOADING SCREEN
========================= */

.loading-screen{

    position:fixed;

    inset:0;

    background:#ffffff;

    z-index:9999;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:20px;
}

.loading-logo{

    width:100px;

    animation:pulse 1.5s infinite;
}

.loading-title{

    font-size:1.2rem;

    font-weight:700;

    color:var(--primary);
}

.loading-sub{

    color:#64748B;
}

.loading-spinner{

    width:50px;
    height:50px;

    border:5px solid #eee;

    border-top-color:var(--primary);

    border-radius:50%;

    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

    100%{
        transform:scale(1);
    }
}

/* =========================
   MOBILE APP HEADER
========================= */

.mobile-header{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:75px;

    background:#ffffff;

    z-index:1000;

    display:flex;

    align-items:center;

    gap:12px;

    padding:12px 15px;

    box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.logo-box img{

    width:48px;
    height:48px;

    object-fit:contain;
}

.system-title{

    display:none;
}

.search-box{

    flex:1;

    background:#F1F5F9;

    border-radius:15px;

    padding:12px 15px;

    display:flex;

    align-items:center;

    gap:10px;

    cursor:pointer;
}

.search-box i{
    color:#64748B;
}

.search-box span{

    color:#64748B;

    font-size:.9rem;
}

.add-btn{

    width:46px;
    height:46px;

    border:none;

    border-radius:14px;

    background:linear-gradient(
        135deg,
        var(--primary),
        var(--primary-dark)
    );

    color:#fff;

    font-size:18px;

    box-shadow:0 5px 15px rgba(139,0,0,.25);
}

/* =========================
   DESKTOP HEADER
========================= */

@media(min-width:992px){

.mobile-header{

    height:90px;

    padding:15px 30px;
}

.logo-box{

    display:flex;

    align-items:center;

    gap:15px;
}

.system-title{

    display:block;
}

.system-title h1{

    margin:0;

    font-size:1.2rem;

    font-weight:800;

    color:var(--primary);
}

.system-title p{

    margin:0;

    color:#64748B;

    font-size:.8rem;
}

.search-box{

    max-width:600px;
}

.app-container{

    padding-top:110px;
}

}

/* =========================
   AWARD CARD
========================= */

.section-title{

    display:flex;

    align-items:center;

    gap:12px;

    margin:35px 0 20px;

    padding:16px 22px;

    background:
    linear-gradient(
    135deg,
    #8B0000,
    #B22222
    );

    color:white;

    border-radius:18px;

    font-size:1.15rem;

    font-weight:800;

    box-shadow:
    0 6px 20px rgba(139,0,0,.18);

}

.section-title::before{

    font-size:1.3rem;

}

.section-title::after{

    content:"";

    flex:1;

    height:2px;

    background:

    linear-gradient(
    to right,
    rgba(255,255,255,.7),
    rgba(255,255,255,0)
    );

}

.award-card{

    background:#ffffff;

    border-radius:22px;

    overflow:hidden;

    border:1px solid #E5E7EB;

    box-shadow:
    0 10px 25px rgba(0,0,0,.08);

    transition:
    transform .25s ease,
    box-shadow .25s ease;

    height:100%;

    display:flex;

    flex-direction:column;
    position:relative;
    overflow:hidden;
    padding:22px;
    animation:fadeCard .4s ease;
}

@keyframes fadeCard{

    from{

        opacity:0;

        transform:translateY(15px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}
.award-card:hover{

    transform:translateY(-6px);

    box-shadow:
    0 18px 40px rgba(0,0,0,.14);

}
      
.award-level{

    position:absolute;
    top:15px;
    right:15px;

    background:rgba(255,255,255,.95);

    color:#8B0000;

    padding:6px 12px;

    border-radius:30px;

    font-size:.75rem;

    font-weight:700;

    box-shadow:0 2px 10px rgba(0,0,0,.12);

    z-index:2;
    border:1px solid rgba(139,0,0,.15);

    backdrop-filter:blur(10px);
}

.award-title{

    position:relative;

    margin-top:65px;

    margin-bottom:18px;

    padding-bottom:12px;

    font-size:1.08rem;

    font-weight:800;

    color:#111827;

    line-height:1.55;

    letter-spacing:.2px;

    border-bottom:1px solid #E5E7EB;

    min-height:55px;
}

.award-detail{

    color:#374151;

    font-size:.93rem;

    line-height:1.8;

}

.award-detail b{

    color:#111827;

    font-weight:700;

}

.btn-view-award{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    font-size:.95rem;

}

.btn-view-award i{

    font-size:1.05rem;

}

.btn-view-award:hover{

    transform:translateY(-2px);

    box-shadow:0 6px 15px rgba(212,175,55,.35);

}   

.award-icon{

    width:60px;
    height:60px;

    border-radius:50%;

    background:#FFF7E0;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:28px;

    margin:20px auto 10px;

    border:3px solid #D4AF37;
}

.award-card::before{

    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:80px;

    background:
linear-gradient(
135deg,
#7A0000 0%,
#A00000 45%,
#D4AF37 100%
);

}

.award-icon{

    position:absolute;

    top:22px;

    left:50%;

    transform:translateX(-50%);

    height:50px;

    align-items:center;

    justify-content:center;

}

.award-card::after{

    content:"";

    position:absolute;

    top:80px;

    left:0;

    right:0;

    height:3px;

    background:#D4AF37;

}

.row.g-3{

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(320px,1fr));

    gap:24px;

}

.row.g-3 > div{

    width:100%;

    max-width:none;

}

/* =========================
BOTTOM TAB BAR (APP STYLE)
========================= */

.bottom-tabbar{

.tab-item i{

.tab-item.active{

.tab-item.active i{

/* เว้นพื้นที่ให้ไม่โดน tab bar บัง */

function createSection(type,title,data){

    const zone =
    document.getElementById("app-content");

    zone.insertAdjacentHTML(
        "beforeend",
        `
       <div class="section-title">
    🏆 ${title}
</div>

        <div class="row g-3 mb-4"
             id="row-${type}">
        </div>
        `
    );

    const row =
    document.getElementById(`row-${type}`);

    buildCards(row,data,type);

}

function buildCards(container,data,type){

    data.forEach(item=>{

        let awardTitle =
        item["ชื่อรางวัล/ผลงานเกียรติยศ"] || "-";

        let year =
        item["ปีการศึกษา"] || "-";

        let level =
        item["ระดับรางวัล"] || "";

        let giver =
        item["หน่วยงานที่มอบรางวัล"] || "-";

        let person = "";

        let dept = "";

        let className = "";

        let pdfLink =
        item["ลิงก์ไฟล์เกียรติบัตร"] || "";

        if(type==="school"){

            person =
            "โรงเรียนพิมานพิทยาสรรค์";

        }

        if(type==="staff"){

            person =
            item["ชื่อ-นามสกุลของคุณครู / บุคลากรผู้ได้รับรางวัล"] || "-";

            dept =
            item["กลุ่มสาระการเรียนรู้"] || "";

        }

        if(type==="student"){

            person =
            item["ชื่อ-นามสกุลนักเรียนที่ได้รับรางวัล"] || "-";

            dept =
            item["กลุ่มสาระการเรียนรู้"] || "";

            className =
            item["ชั้นเรียน"] || "";

        }

        container.insertAdjacentHTML(
            "beforeend",
            createCardHTML(
                type,
                awardTitle,
                person,
                giver,
                year,
                level,
                dept,
                className,
                pdfLink
            )
        );

    });

}

function openPDF(encoded){

    let url =
    decodeURIComponent(encoded);

    if(!url){

        alert("ไม่พบไฟล์");

        return;
    }

    if(
        url.includes(
            "drive.google.com/file/d/"
        )
    ){

        url =
        url.replace(
            "/view",
            "/preview"
        );

    }

    document
    .getElementById("pdfFrame")
    .src = url;

    document
    .getElementById("viewerModal")
    .classList
    .remove("d-none");

}

function closePDF(){

    document
    .getElementById("viewerModal")
    .classList
    .add("d-none");

    document
    .getElementById("pdfFrame")
    .src="";

}

function changeTab(tab){

    currentTab = tab;

    // เปลี่ยน active tab
    document.querySelectorAll('.tab-item')
    .forEach(btn => btn.classList.remove('active'));

    document.getElementById('nav-' + tab)
    .classList.add('active');

    const zone = document.getElementById("app-content");
    zone.innerHTML = "";

    if(tab === "home"){
        renderHomePage();
        return;
    }

    createSection(
        tab,
        getTabTitle(tab),
        (allAwardsData[tab] || []).slice().reverse()
    );
}

function getTabTitle(tab){

    if(tab==="school")
    return "รางวัลสถานศึกษา";

    if(tab==="staff")
    return "รางวัลครูและบุคลากร";

    return "รางวัลนักเรียน";

}

function searchAwards(){

    const keyword =
    document
    .getElementById("search-input")
    .value
    .toLowerCase();

    let result = [];

    ["school","staff","student"]
    .forEach(type=>{

        allAwardsData[type]
        .forEach(item=>{

            const text =
            JSON.stringify(item)
            .toLowerCase();

            if(
                text.includes(keyword)
            ){

                result.push({
                    type:type,
                    item:item
                });

            }

        });

    });

    renderSearchResult(result);

}

function renderSearchResult(result){

    const zone =
    document.getElementById("search-result-container");

    zone.innerHTML="";

    if(result.length===0){

        zone.innerHTML=`

        <div class="empty-box">
            ไม่พบข้อมูล
        </div>

        `;

        return;
    }

    result.forEach(obj=>{

        const row =
        document.createElement("div");

        row.className =
        "mb-3";

        buildCards(
            row,
            [obj.item],
            obj.type
        );

        zone.appendChild(row);

    });

}

// ==========================================
// SAVE AWARD
// ==========================================

async function saveAward(){

    const type = document.getElementById('awardType').value;
    const year = document.getElementById('awardYear').value.trim();
    const rewardLevel = document.getElementById('awardLevel').value;

    const title = document.getElementById('awardTitle').value.trim();
    const giver = document.getElementById('awardGiver').value.trim();

    const nameEl = document.getElementById('awardPerson');
    const deptEl = document.getElementById('awardDept');
    const classEl = document.getElementById('awardClass');

    const name = nameEl ? nameEl.value.trim() : "";
    const dept = deptEl ? deptEl.value.trim() : "";
    const className = classEl ? classEl.value.trim() : "";

    const fileInput = document.getElementById('awardFile');

    // VALIDATE
    if(!year) return alert('กรุณาระบุปีการศึกษา');
    if(!title) return alert('กรุณาระบุชื่อรางวัล');
    if(!giver) return alert('กรุณาระบุหน่วยงานที่มอบ');

    if(type !== 'school' && !name)
        return alert('กรุณาระบุชื่อผู้รับรางวัล');

    if(type === 'student' && !className)
        return alert('กรุณาระบุชั้นเรียน');

    if(fileInput.files.length === 0)
        return alert('กรุณาแนบไฟล์ PDF');

    const file = fileInput.files[0];

    if(file.type !== 'application/pdf')
        return alert('รองรับเฉพาะ PDF เท่านั้น');

    // BUTTON LOADING
    const btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.innerHTML = `กำลังบันทึก...`;

    try{

        const base64 = await fileToBase64(file);

        const payload = {
            type,
            year,
            rewardLevel,
            title,
            giver,
            name,
            dept,
            className,
            fileMimeType: file.type,
            fileData: base64.split(',')[1]
        };

        const res = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });

        const result = await res.json();

        if(result.status === 'success'){

            alert('บันทึกสำเร็จ');

            document.getElementById('awardForm').reset();
            document.getElementById('dynamicFormArea').innerHTML = "";

            closeAwardForm();

            await loadAwards();

        } else {
            alert(result.message || 'บันทึกไม่สำเร็จ');
        }

    } catch(err){
        console.error(err);
        alert('เกิดข้อผิดพลาด');
    }

    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล`;
}

// =============================
function fileToBase64(file){
    return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

}
