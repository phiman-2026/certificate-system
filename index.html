<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PMS Digital Honor App</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>

:root{
    --primary:#1E40AF;
    --primary-dark:#1E3A8A;
    --gold:#60A5FA;
    --bg:#F8FAFC;
    --text:#0F172A;
    --text-light:#64748B;
    --border:#CBD5E1;
    --radius:18px;
}

/* =========================
   RESET
========================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Prompt',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

.d-none{
    display:none !important;
}

/* =========================
   APP LAYOUT
========================= */
.app-container{
    width:100%;
    min-height:100vh;
    padding-top:85px;
    padding-bottom:95px;
}

.content-wrap{
    max-width:1400px;
    margin:auto;
    padding:15px;
}

/* =========================
   SCROLLBAR
========================= */
::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:#CBD5E1;
    border-radius:20px;
}

/* =========================
   LOADING SCREEN
========================= */
.loading-screen{
    position:fixed;
    inset:0;
    background:#fff;
    z-index:9999;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:15px;
}

.loading-logo{
    width:90px;
    animation:pulse 1.5s infinite;
}

.loading-title{
    font-size:1.2rem;
    font-weight:700;
    color:var(--primary);
}

.loading-sub{
    color:var(--text-light);
}

.loading-spinner{
    width:45px;
    height:45px;
    border:5px solid #eee;
    border-top-color:var(--primary);
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

/* =========================
   HEADER
========================= */
.mobile-header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:75px;
    background:#fff;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 15px;
    box-shadow:0 2px 15px rgba(0,0,0,.08);
    z-index:1000;
}

.logo-box img{
    width:48px;
    height:48px;
    object-fit:contain;
}

.system-title{
    display:none;
}

.search-box{
    flex:1;
    background:#F1F5F9;
    border-radius:14px;
    padding:10px 12px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    color:var(--text-light);
}

.add-btn{
    width:46px;
    height:46px;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
}

/* =========================
   DESKTOP (PREMIUM BANNER - สีแดงเข้มพิเศษ)
========================= */
@media(min-width: 992px) {
    .mobile-header {
        height: 90px;
        padding: 0 40px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        gap: 20px;
        z-index: 1000;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        
        /* แบนเนอร์โทนเทา Slate Grey */
        background: linear-gradient(135deg, rgba(71, 85, 105, 0.9), rgba(51, 65, 85, 0.9)),
                    url("https://raw.githubusercontent.com/phiman-2026/picture/main/Picindex.png");
        background-size: cover;
        background-position: center;
    }

    /* เส้นขอบล่าง: แดงเข้ม (#881313) */
    .mobile-header::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, #7f1d1d, #881313, #7f1d1d);
        box-shadow: 0 0 8px rgba(136, 19, 19, 0.5);
    }

    .logo-box img {
        width: 50px !important;
        height: 50px !important;
    }

    .system-title {
        display: block !important;
        color: #fff;
        margin-right: 20px;
        white-space: nowrap;
    }
    .system-title h1 { font-size: 1.1rem !important; font-weight: 800 !important; color: #fff !important; margin: 0 !important; }
    .system-title p { font-size: 0.75rem !important; color: rgba(255, 255, 255, 0.8) !important; margin: 0 !important; }

    .search-box {
        flex: 1;
        max-width: 800px;
        height: 45px !important;
        background: rgba(255, 255, 255, 0.15) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        color: #fff !important;
        margin-left: 20px;
    }
    
    .search-box span { color: #fff !important; }

    /* ปุ่มเพิ่มรางวัล: แดงเข้ม (#881313) */
    .add-btn {
        margin-left: auto;
        width: 45px !important;
        height: 45px !important;
        background: #881313 !important; 
        color: #FFFFFF !important;     
        flex-shrink: 0;
        border: none !important;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(136, 19, 19, 0.3);
    }
    
    .add-btn:hover {
        background: #7f1d1d !important; 
        transform: scale(1.05);
        box-shadow: 0 6px 15px rgba(136, 19, 19, 0.5);
    }

    .app-container {
        padding-top: 100px !important; 
    }
}
      
/* =========================
   SEARCH SCREEN
========================= */
.search-screen{
    position:fixed;
    inset:0;
    background:#F8FAFC;
    z-index:3000;
    overflow-y:auto;
}

.search-header{
    position:sticky;
    top:0;
    background:#fff;
    display:flex;
    gap:10px;
    padding:15px;
    box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.search-header input{
    flex:1;
    height:45px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#F1F5F9;
    padding:0 15px;
}

.search-back-btn{
    width:45px;
    height:45px;
    border:none;
    border-radius:12px;
    background:#F1F5F9;
}

/* FILTER */
.search-filter-panel{
    background:#fff;
    margin:15px;
    padding:18px;
    border-radius:16px;
    box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.search-filter-title{
    font-weight:700;
    color:var(--primary);
    margin-bottom:10px;
}

.filter-label{
    display:block;
    margin-top:10px;
    font-size:.9rem;
    font-weight:600;
}

.filter-select{
    width:100%;
    height:42px;
    border:1px solid var(--border);
    border-radius:10px;
    padding:0 10px;
}

/* =========================
   CARD SYSTEM: PREMIUM UI V5
========================= */

/* ปรับการแสดงผลจำนวนคอลัมน์ (Responsive Grid) */
.row.g-3 {
    display: grid;
    gap: 20px;
    padding: 10px;
    grid-template-columns: 1fr; /* มือถือ: 1 */
}
@media(min-width: 768px) { .row.g-3 { grid-template-columns: repeat(3, 1fr); } } /* แท็บเล็ต: 3 */
@media(min-width: 1200px) { .row.g-3 { grid-template-columns: repeat(4, 1fr); } } /* คอมพิวเตอร์: 4 */

/* การ์ดสไตล์พรีเมียม */
.award-card {
    background: #fff;
    border-radius: 20px;
    padding: 0;
    overflow: hidden;
    transition: 0.3s;
    border: 1px solid #eee;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
}

.award-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
}

/* ส่วนหัวการ์ด */
.card-header-img {
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #f8fafc;
}

/* ป้ายระดับรางวัล */
.award-badge-points {
    background: #ffffff;
    color: #8B0000;
    padding: 4px 12px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.75rem;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    position: absolute;
    bottom: -12px;
    border: 1px solid #fee2e2;
}

/* ส่วนเนื้อหา */
.card-body-content {
    padding: 20px 15px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.award-title { 
    font-weight: 800; 
    font-size: 1rem; 
    margin-bottom: 12px; 
    height: 45px; 
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    color: #1e293b;
}

.award-meta {
    text-align: left;
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 15px;
}

.award-meta p {
    margin: 3px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* ปุ่มดูเกียรติบัตร (Modern Gradient & Glow Effect) */
.btn-view-award {
    margin-top: auto; 
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 14px; /* ปรับให้โค้งมนขึ้น */
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    
    /* เพิ่ม Gradient ให้ดูมีมิติ */
    filter: brightness(1);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    
    /* เพิ่มเงาจางๆ ที่ฐานปุ่ม */
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.btn-view-award:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    filter: brightness(1.1); /* สว่างขึ้นเล็กน้อยเวลา Hover */
}

.btn-view-award:active {
    transform: translateY(0) scale(0.98);
}

/* เพิ่ม Effect ประกายเล็กน้อยในไอคอน */
.btn-view-award i {
    font-size: 1.1rem;
    opacity: 0.9;
}
      
/* =========================
   FORM MODAL (PREMIUM RED-GREY THEME)
========================= */
.award-form-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
}

.award-form-container{
    width:100%;
    max-width:900px;
    max-height:90vh;
    background:#fff;
    border-radius:24px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

/* HEADER: แดงเข้ม */
.award-form-header{
    background: linear-gradient(135deg, #881313, #7f1d1d);
    color:#fff;
    padding:18px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.award-form-header h5{
    margin:0;
    font-size:1.15rem;
    font-weight:700;
}

.award-form-header button{
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background: rgba(255,255,255,.2);
    color:#fff;
    font-size:20px;
    cursor:pointer;
    transition:.25s;
}

.award-form-header button:hover{
    background: rgba(255,255,255,.4);
    transform:scale(1.05);
}

/* BODY */
.award-form-body{
    flex:1;
    overflow-y:auto;
    padding:25px;
    background:#F8FAFC;
}

.award-form-body::-webkit-scrollbar{ width:8px; }
.award-form-body::-webkit-scrollbar-thumb{ background:#CBD5E1; border-radius:20px; }

/* INPUT STYLING */
.award-form-body label{
    font-weight:600;
    color:#334155;
    margin-bottom:6px;
    display:block;
}

.form-control, .form-select{
    min-height:48px;
    border-radius:12px !important;
    border:1px solid #CBD5E1;
    background:#fff;
    transition:.25s;
}

.form-control:focus, .form-select:focus{
    border-color:#881313;
    box-shadow: 0 0 0 4px rgba(136, 19, 19, .15);
}

/* PDF PREVIEW: โทนแดงอ่อน */
#pdfPreview{
    background:#FEF2F2;
    border:1px solid #FECACA;
    color:#991B1B;
    padding:10px 14px;
    border-radius:10px;
    margin-top:10px;
    font-weight:500;
}

/* BUTTONS */
.btn-save, .btn-cancel{
    flex:1;
    height:54px;
    border:none;
    border-radius:14px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.25s;
}

/* SAVE: แดงเข้ม */
.btn-save{
    background: linear-gradient(135deg, #881313, #7f1d1d);
    color:#fff;
    box-shadow: 0 5px 15px rgba(136, 19, 19,.25);
}

.btn-save:hover{
    transform:translateY(-2px);
    box-shadow: 0 10px 20px rgba(136, 19, 19,.35);
}

/* CANCEL: เทาหรูหรา */
.btn-cancel{
    background:#E2E8F0;
    color:#475569;
}

.btn-cancel:hover{
    background:#CBD5E1;
    transform:translateY(-2px);
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){
    .award-form-modal{
        padding:0;
    }

    .award-form-container{
        width:100%;
        height:100vh;
        max-height:100vh;
        border-radius:0;
    }

    .award-form-body{
        padding:18px;
    }
      
    .form-action-bar{
        padding:15px;
    }
}

/* =========================
   TAB BAR
========================= */
.bottom-tabbar{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:70px;
    background:#fff;
    display:flex;
    justify-content:space-around;
    align-items:center;
    border-top:1px solid #eee;
    z-index:1000;
}

.tab-item{
    background:none;
    border:none;
    font-size:12px;
    color:var(--text-light);
    display:flex;
    flex-direction:column;
    align-items:center;
}

.tab-item.active{
    color:var(--primary);
}

#toastBox{
    position:fixed;
    top:20px;
    right:20px;
    z-index:99999;
}

.toast-msg{
    min-width:300px;
    background:#fff;
    padding:15px 20px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    margin-bottom:10px;
    animation:slideIn .3s ease;
}

.toast-success{
    border-left:5px solid #16A34A;
}

.toast-error{
    border-left:5px solid #DC2626;
}

@keyframes slideIn{
    from{
        transform:translateX(100%);
        opacity:0;
    }
    to{
        transform:translateX(0);
        opacity:1;
    }
}

</style>

</head>
<body>

<!-- LOADING -->
<div id="loading-screen" class="loading-screen">

  <img
    src="https://raw.githubusercontent.com/phiman-2026/picture/main/logo%20phiman.png"
    class="loading-logo"
    alt="logo">

  <div class="loading-spinner"></div>
  <div class="loading-title">PMS Digital Honor App</div>
  <div class="loading-sub">กำลังโหลดข้อมูล...</div>

</div>

<!-- APP -->
<div class="app-container">

  <!-- HEADER -->
  <header class="mobile-header">

      <div class="logo-box">
  <img src="https://raw.githubusercontent.com/phiman-2026/picture/main/logo%20phiman.png">
</div>

<div class="system-title">
  <h1>PMS Digital Honor App</h1>
  <p>โรงเรียนพิมานพิทยาสรรค์</p>
</div>
<div class="search-box" onclick="openSearchScreen()">
      <i class="fa-solid fa-search"></i>
      <span>ค้นหารางวัล...</span>
    </div>

    <button class="add-btn" onclick="openAwardForm()">
      <i class="fa-solid fa-plus"></i>
    </button>

  </header>

  <!-- CONTENT -->
  <main class="content-wrap">
    <div id="app-content"></div>
  </main>

</div>

<!-- SEARCH -->
<div id="search-screen" class="search-screen d-none">

  <div class="search-header">

    <button class="search-back-btn" onclick="closeSearchScreen()">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <input id="search-input"
           placeholder="ค้นหารางวัล..."
           onkeyup="searchAwards()">

  </div>

  <!-- FILTER PANEL -->
  <div class="search-filter-panel">

    <label class="filter-label">ปีการศึกษา</label>
    <select id="filter-year" onchange="setFilter('year', this.value)" class="filter-select">
      <option value="all">ทั้งหมด</option>
      <option value="2570">2570</option>
      <option value="2569">2569</option>
      <option value="2568">2568</option>
    </select>

    <label class="filter-label">ระดับรางวัล</label>
    <select id="filter-level" onchange="setFilter('level', this.value)" class="filter-select">
      <option value="all">ทั้งหมด</option>
      <option value="ระดับโรงเรียน">ระดับโรงเรียน</option>
      <option value="ระดับจังหวัด">ระดับจังหวัด</option>
      <option value="ระดับชาติ">ระดับชาติ</option>
    </select>

    <label class="filter-label">กลุ่มสาระ</label>
    <select id="filter-dept" onchange="setFilter('dept', this.value)" class="filter-select">
      <option value="all">ทั้งหมด</option>
      <option value="วิทยาศาสตร์และเทคโนโลยี">วิทยาศาสตร์และเทคโนโลยี</option>
      <option value="คณิตศาสตร์">คณิตศาสตร์</option>
      <option value="ภาษาไทย">ภาษาไทย</option>
    </select>

  </div>

  <div id="search-result-container" class="content-wrap"></div>

</div>

<!-- FORM MODAL (สำคัญ ต้องเก็บ) -->
<div id="awardFormModal" class="award-form-modal d-none">

  <div class="award-form-container">

    <div class="award-form-header">
      <h5>บันทึกรางวัลใหม่</h5>
      <button onclick="closeAwardForm()">✕</button>
    </div>

    <div class="award-form-body">

     <form id="awardForm">

  <!-- ประเภท + ปีการศึกษา -->
  <div class="row g-3">

    <div class="col-md-6">

      <label class="form-label">
        ประเภทรางวัล
      </label>

      <select id="awardType"
              class="form-select"
              onchange="changeAwardType()">

        <option value="school">
          รางวัลสถานศึกษา
        </option>

        <option value="staff">
          รางวัลครู / บุคลากร
        </option>

        <option value="student">
          รางวัลนักเรียน
        </option>

      </select>

    </div>

    <div class="col-md-6">

      <label class="form-label">
        ปีการศึกษา
      </label>

      <input
        id="awardYear"
        type="number"
        value="2569"
        class="form-control">

    </div>

  </div>

  <!-- Dynamic Area -->
  <div id="dynamicFormArea" class="mt-3">

    <div class="alert alert-info">
      🏫 รางวัลสถานศึกษา ไม่ต้องกรอกชื่อผู้รับรางวัล
    </div>

  </div>

  <!-- กลุ่มสาระ -->
<div id="deptArea" class="mt-3">

<label>กลุ่มสาระ</label>

<select id="awardDept"
class="form-select">

<option value="">เลือกกลุ่มสาระ</option>

<option>ภาษาไทย</option>
<option>คณิตศาสตร์</option>
<option>วิทยาศาสตร์และเทคโนโลยี</option>
<option>สังคมศึกษา ศาสนา และวัฒนธรรม</option>
<option>ภาษาต่างประเทศ</option>
<option>สุขศึกษาและพลศึกษา</option>
<option>ศิลปะ</option>
<option>การงานอาชีพ</option>

<option>กิจกรรมพัฒนาผู้เรียน</option>

</select>

</div>

  <!-- ระดับรางวัล -->
  <div class="mt-3">

    <label class="form-label">
      ระดับรางวัล
    </label>

    <select id="awardLevel"
            class="form-select">

<script>
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxE7FswOf3r9E6olu-_Ss-CH4VMwT1A2Cs45WZsjR5LBvbHe3LymyXVUfNTJwU5xBXhLg/exec";

const TYPE_CONFIG = {
  school: {
    icon: "🏫",
    color: "#8B0000",
    title: "รางวัลสถานศึกษา"
  },
  staff: {
    icon: "👨‍🏫",
    color: "#2563EB",
    title: "รางวัลครู"
  },
  student: {
    icon: "🎓",
    color: "#16A34A",
    title: "รางวัลนักเรียน"
  }
};
      
let filters = {
  year: "all",
  level: "all",
  dept: "all"
};
      
let allAwardsData = {
  school: [],
  staff: [],
  student: []
};

let currentTab = "home";

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", () => {
  initApp();
});

async function initApp() {
  showLoadingScreen();
  try {
    await loadAwards();
    renderHomePage();
  } finally {
    hideLoadingScreen();
  }
}

/* =========================
   LOAD DATA
========================= */
async function loadAwards() {

  try {

    const res = await fetch(GAS_WEB_APP_URL);

    if (!res.ok) {
      throw new Error(`HTTP Error ${res.status}`);
    }

    const data = await res.json();

    allAwardsData = data;

  } catch (err) {

    console.error(err);

    Swal.fire({
      icon: "error",
      title: "โหลดข้อมูลไม่สำเร็จ",
      text: "ไม่สามารถเชื่อมต่อฐานข้อมูลได้",
      confirmButtonColor: "#8B0000"
    });

  }

}

/* =========================
   LOADING
========================= */
function showLoadingScreen() {
  document.getElementById("loading-screen").style.display = "flex";
}

function hideLoadingScreen() {
  document.getElementById("loading-screen").style.display = "none";
}

/* =========================
   HOME
========================= */
function renderHomePage() {
  const zone = document.getElementById("app-content");
  zone.innerHTML = "";

  renderSection("school", "รางวัลสถานศึกษา");
  renderSection("staff", "รางวัลครูและบุคลากร");
  renderSection("student", "รางวัลนักเรียน");
}

/* =========================
   SECTION + CARDS (MAIN)
========================= */
function renderSection(type, title) {
  const zone = document.getElementById("app-content");

  let data = (allAwardsData[type] || []).slice().reverse();

  // ===== FILTER SYSTEM =====
  data = data.filter(item => {

    const yearMatch =
      filters.year === "all" ||
      item["ปีการศึกษา"] == filters.year;

    const levelMatch =
      filters.level === "all" ||
      item["ระดับรางวัล"] == filters.level;

    const deptMatch =
      filters.dept === "all" ||
      (item["กลุ่มสาระการเรียนรู้"] || "") == filters.dept;

    return yearMatch && levelMatch && deptMatch;
  });

  // limit
  data = data.slice(0, 12);

  zone.insertAdjacentHTML("beforeend", `
    <div class="section-title">🏆 ${title}</div>
    <div class="row g-3 mb-4" id="row-${type}"></div>
  `);

  const row = document.getElementById(`row-${type}`);
  buildCards(row, data, type);
}

/* =========================
   CARD BUILDER (สำคัญ)
========================= */
function buildCards(container, data, type) {

  const config = TYPE_CONFIG[type] || TYPE_CONFIG.school;

  data.forEach(item => {

    const title =
      item["ชื่อรางวัล/ผลงานเกียรติยศ"] || "-";

    const year =
      item["ปีการศึกษา"] || "-";

    const level =
      item["ระดับรางวัล"] || "-";

    const giver =
      item["หน่วยงานที่มอบรางวัล"] || "-";

    const dept =
      item["กลุ่มสาระการเรียนรู้"] || "";

    const className =
      item["ชั้นเรียน"] || "";

    const pdfUrl =
      item["ลิงก์ไฟล์เกียรติบัตร"] || "";

    let person = "";

    if (type === "school") {
      person = "โรงเรียนพิมานพิทยาสรรค์";
    }

    if (type === "staff") {
      person =
        item["ชื่อ-นามสกุลของคุณครู / บุคลากรผู้ได้รับรางวัล"] || "-";
    }

    if (type === "student") {
      person =
        item["ชื่อ-นามสกุลนักเรียนที่ได้รับรางวัล"] || "-";
    }

    container.insertAdjacentHTML(
      "beforeend",
      createCardHTML(
        type,
        title,
        person,
        giver,
        year,
        level,
        dept,
        className,
        config,
        pdfUrl
      )
    );

  });
}

/* =========================
   CARD HTML
========================= */
function createCardHTML(type, title, person, giver, year, level, dept, className, config, pdfUrl) {
    // กำหนดสีตามประเภท
    const headerColor = type === 'school' ? '#fde2e2' : (type === 'staff' ? '#dbeafe' : '#dcfce7');
    const badgeColor = type === 'school' ? '#f87171' : (type === 'staff' ? '#3b82f6' : '#22c55e');
    // กำหนดสีปุ่มให้แมตช์กับ Badge (เข้มขึ้นเล็กน้อยเพื่อให้กดง่าย)
    const btnColor = type === 'school' ? '#e11d48' : (type === 'staff' ? '#1d4ed8' : '#15803d');

    return `
    <div class="award-card">
        <div class="card-header-img" style="background-color: ${headerColor}">
            <img src="https://raw.githubusercontent.com/phiman-2026/picture/main/logo%20phiman.png" style="width: 60px;">
            <div class="award-badge-points" style="color: ${badgeColor}; border: 1px solid ${badgeColor}">
                ${level}
            </div>
        </div>
        <div class="card-body-content">
            <div class="award-title">${title}</div>
            <div class="award-meta">
                <p><strong>ผู้ได้รับ:</strong> ${person}</p>
                ${className ? `<p><strong>ชั้นเรียน:</strong> ${className}</p>` : ''}
                <p><strong>หน่วยงาน:</strong> ${giver}</p>
                <p><strong>ปีการศึกษา:</strong> ${year}</p>
            </div>
            <button class="btn-view-award" 
                    style="background-color: ${btnColor}" 
                    onclick="openPDF('${pdfUrl}')">
                <i class="fa-solid fa-file-pdf"></i> ดูเกียรติบัตร
            </button>
        </div>
    </div>`;
}

/* =========================
   TAB SYSTEM (FIXED)
========================= */
function changeTab(tab) {

  currentTab = tab;

  document.querySelectorAll(".tab-item")
    .forEach(el => el.classList.remove("active"));

  document.getElementById("nav-" + tab).classList.add("active");

  const zone = document.getElementById("app-content");
  zone.innerHTML = "";

  if (tab === "home") {
    renderHomePage();
    return;
  }

  renderSection(
    tab,
    tab === "school"
      ? "รางวัลสถานศึกษา"
      : tab === "staff"
        ? "รางวัลครูและบุคลากร"
        : "รางวัลนักเรียน"
  );
}

/* =========================
   SEARCH (FIXED)
========================= */
function openSearchScreen() {
  document.getElementById("search-screen").classList.remove("d-none");
  document.body.style.overflow = "hidden";
}

function closeSearchScreen() {
  document.getElementById("search-screen").classList.add("d-none");
  document.body.style.overflow = "";
}

function searchAwards() {

  const keyword = document.getElementById("search-input").value.toLowerCase();

  let result = [];

  ["school", "staff", "student"].forEach(type => {

    (allAwardsData[type] || []).forEach(item => {

      const matchText = JSON.stringify(item).toLowerCase();

      const filterMatch =
        (filters.year === "all" || item["ปีการศึกษา"] == filters.year) &&
        (filters.level === "all" || item["ระดับรางวัล"] == filters.level) &&
        (filters.dept === "all" || (item["กลุ่มสาระการเรียนรู้"] || "") == filters.dept);

      if (matchText.includes(keyword) && filterMatch) {
        result.push({ type, item });
      }
    });

  });

  renderSearchResult(result);
}

/* =========================
   SEARCH RESULT
========================= */
function renderSearchResult(result) {

  const zone = document.getElementById("search-result-container");
  zone.innerHTML = "";

  if (result.length === 0) {
    zone.innerHTML = `<div class="empty-box">ไม่พบข้อมูล</div>`;
    return;
  }

  result.forEach(obj => {

    const wrap = document.createElement("div");
    wrap.className = "mb-3";

    buildCards(wrap, [obj.item], obj.type);

    zone.appendChild(wrap);
  });
}

/* =========================
   PDF VIEW (SAFE FIX)
========================= */

  if(url.includes("drive.google.com")){
    url = url.replace("/view","/preview");

function renderDashboard() {
  // ตอนนี้ยังไม่ทำ filter logic เต็ม
  // แต่กัน error ไม่ให้ระบบพัง
  if (currentTab === "home") {
    renderHomePage();
  } else {
    changeTab(currentTab);
  }
}

async function saveAward() {

  const btn = document.getElementById("btn-save");

  // =====================
  // ดึงข้อมูลจากฟอร์ม
  // =====================

  const type =
    document.getElementById("awardType").value;

  const year =
    document.getElementById("awardYear").value.trim();

  const dept =
    document.getElementById("awardDept").value.trim();

  const rewardLevel =
    document.getElementById("awardLevel").value.trim();

  const title =
    document.getElementById("awardTitle").value.trim();

  const giver =
    document.getElementById("awardGiver").value.trim();

  const file =
    document.getElementById("awardFile").files[0];

  let name = "";
  let className = "";

  // =====================
  // VALIDATION
  // =====================

  if (!year) {
    return Swal.fire({
      icon: "warning",
      title: "ข้อมูลไม่ครบ",
      text: "กรุณาระบุปีการศึกษา",
      confirmButtonColor: "#8B0000"
    });
  }

  if (!rewardLevel) {
    return Swal.fire({
      icon: "warning",
      title: "ข้อมูลไม่ครบ",
      text: "กรุณาเลือกระดับรางวัล",
      confirmButtonColor: "#8B0000"
    });
  }

  if (!title) {
    return Swal.fire({
      icon: "warning",
      title: "ข้อมูลไม่ครบ",
      text: "กรุณากรอกชื่อรางวัล",
      confirmButtonColor: "#8B0000"
    });
  }

  if (!giver) {
    return Swal.fire({
      icon: "warning",
      title: "ข้อมูลไม่ครบ",
      text: "กรุณากรอกหน่วยงานที่มอบรางวัล",
      confirmButtonColor: "#8B0000"
    });
  }

  if (!file) {
    return Swal.fire({
      icon: "warning",
      title: "ยังไม่ได้เลือกไฟล์",
      text: "กรุณาแนบไฟล์ PDF",
      confirmButtonColor: "#8B0000"
    });
  }

  // =====================
  // STAFF
  // =====================

  if (type === "staff") {

    name =
      document.getElementById("awardPerson")?.value.trim() || "";

    if (!name) {
      return Swal.fire({
        icon: "warning",
        title: "ข้อมูลไม่ครบ",
        text: "กรุณากรอกชื่อครู/บุคลากร",
        confirmButtonColor: "#8B0000"
      });
    }

    if (!dept) {
      return Swal.fire({
        icon: "warning",
        title: "ข้อมูลไม่ครบ",
        text: "กรุณาเลือกกลุ่มสาระ",
        confirmButtonColor: "#8B0000"
      });
    }
  }

  // =====================
  // STUDENT
  // =====================

  if (type === "student") {

    name =
      document.getElementById("awardPerson")?.value.trim() || "";

    className =
      document.getElementById("awardClass")?.value.trim() || "";

    if (!name) {
      return Swal.fire({
        icon: "warning",
        title: "ข้อมูลไม่ครบ",
        text: "กรุณากรอกชื่อนักเรียน",
        confirmButtonColor: "#8B0000"
      });
    }

    if (!className) {
      return Swal.fire({
        icon: "warning",
        title: "ข้อมูลไม่ครบ",
        text: "กรุณากรอกชั้นเรียน",
        confirmButtonColor: "#8B0000"
      });
    }

    if (!dept) {
      return Swal.fire({
        icon: "warning",
        title: "ข้อมูลไม่ครบ",
        text: "กรุณาเลือกกลุ่มสาระ",
        confirmButtonColor: "#8B0000"
      });
    }
  }

  // =====================
  // FILE CHECK
  // =====================

  if (file.type !== "application/pdf") {

    return Swal.fire({
      icon: "error",
      title: "ไฟล์ไม่ถูกต้อง",
      text: "อนุญาตเฉพาะไฟล์ PDF เท่านั้น",
      confirmButtonColor: "#8B0000"
    });

  }

  if (file.size > 10 * 1024 * 1024) {

    return Swal.fire({
      icon: "error",
      title: "ไฟล์ใหญ่เกินกำหนด",
      text: "กรุณาเลือกไฟล์ไม่เกิน 10 MB",
      confirmButtonColor: "#8B0000"
    });

  }

  // =====================
  // LOADING
  // =====================

  Swal.fire({
    title: "กำลังบันทึกข้อมูล",
    text: "กรุณารอสักครู่...",
    allowOutsideClick: false,
    allowEscapeKey: false,
    confirmButtonColor: "#8B0000",
    didOpen: () => {
      Swal.showLoading();
    }
  });

  btn.disabled = true;

  btn.innerHTML = `
    <i class="fa-solid fa-spinner fa-spin"></i>
    กำลังบันทึก...
  `;

  try {

    const fileBase64 =
      await convertFileToBase64(file);

    const payload = {
      type,
      year,
      rewardLevel,
      title,
      giver,
      name,
      dept,
      className,
      fileData: fileBase64,
      fileMimeType: file.type
    };

    const response = await fetch(
      GAS_WEB_APP_URL,
      {
        method: "POST",
        body: JSON.stringify(payload)
      }
    );

    const result = await response.json();

    if (result.status !== "success") {
      throw new Error(
        result.message || "เกิดข้อผิดพลาด"
      );
    }

    Swal.close();

    await Swal.fire({
      icon: "success",
      title: "บันทึกรางวัลสำเร็จ",
      html: `
        <div style="font-size:15px">
          เพิ่มข้อมูลรางวัลเรียบร้อยแล้ว
          <br><br>
          <b style="color:#8B0000">${title}</b>
        </div>
      `,
      confirmButtonColor: "#8B0000"
    });

    document.getElementById("awardForm").reset();

    document.getElementById("pdfPreview").innerHTML = "";

    changeAwardType();

    closeAwardForm();

    await loadAwards();

    if (currentTab === "home") {
      renderHomePage();
    } else {
      changeTab(currentTab);
    }

  } catch (err) {

    console.error(err);

    Swal.close();

    Swal.fire({
      icon: "error",
      title: "บันทึกไม่สำเร็จ",
      text: err.message,
      confirmButtonColor: "#8B0000"
    });

  } finally {

    btn.disabled = false;

    btn.innerHTML = `
      <i class="fa-solid fa-floppy-disk"></i>
      บันทึก
    `;
  }
}

function convertFileToBase64(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {

      const base64 =
        reader.result.split(",")[1];

      resolve(base64);
    };

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

function setFilter(type, value) {
  filters[type] = value;
  renderHomePage(); // รีโหลดหน้าหลัก
}

function resetFilters() {
  filters = { year: "all", level: "all", dept: "all" };
  renderHomePage();
}

  toast.innerHTML =

  box.appendChild(toast);

  setTimeout(()=>{

}

    document.getElementById("toastBox");

  toast.innerHTML =

  box.appendChild(toast);

  setTimeout(()=>{
    toast.remove();
  },4000);
}

function previewPDFName() {

  const file =
    document.getElementById("awardFile").files[0];

  const preview =
    document.getElementById("pdfPreview");

  if (!file) {
    preview.innerHTML = "";
    return;
  }

  preview.innerHTML = `
    <i class="fa-solid fa-file-pdf text-danger"></i>
    ${file.name}
  `;
}

</script>
</body>
