<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเก็บผลงานรางวัลเกียรติยศ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f7f6; color: #333; }
        .navbar { background: linear-gradient(135deg, #0d6efd, #00c6ff); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .category-btn { cursor: pointer; transition: all 0.3s ease; border: none; border-radius: 12px; padding: 20px; text-align: center; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .category-btn:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .bg-school { background: linear-gradient(135deg, #20c997, #009688); }
        .bg-staff { background: linear-gradient(135deg, #6610f2, #6f42c1); }
        .bg-student { background: linear-gradient(135deg, #fd7e14, #f85a40); }
        .award-card { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); transition: all 0.3s ease; background: #fff; }
        .award-card:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .badge-dept { background-color: #e9ecef; color: #495057; font-weight: 500; }
        .login-panel, .admin-panel { display: none; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="#" onclick="showDashboard()"><i class="fa-solid fa-trophy me-2 text-warning"></i> ระบบเก็บผลงานรางวัลเกียรติยศ</a>
            <div class="ms-auto">
                <button id="btn-login-trigger" class="btn btn-light rounded-pill px-4" onclick="toggleLoginSection()"><i class="fa-solid fa-user-lock me-1"></i> สำหรับคุณครู</button>
                <span id="welcome-text" class="text-white me-3 d-none"></span>
                <button id="btn-logout" class="btn btn-danger rounded-pill px-4 d-none" onclick="logout()"><i class="fa-solid fa-sign-out-alt"></i> ออกระบบ</button>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div id="login-section" class="row justify-content-center mb-4 d-none">
            <div id="login-form-box" class="col-md-5 login-panel">
                <h4 class="text-center mb-3"><i class="fa-solid fa-key text-primary"></i> เข้าสู่ระบบคุณครู</h4>
                <div class="mb-3">
                    <label class="form-label">ชื่อผู้ใช้งาน</label>
                    <input type="text" id="username" class="form-control" placeholder="Username">
                </div>
                <div class="mb-3">
                    <label class="form-label">รหัสผ่าน</label>
                    <input type="password" id="password" class="form-control" placeholder="Password">
                </div>
                <button class="btn btn-primary w-100 rounded-pill" onclick="login()">เข้าสู่ระบบ</button>
            </div>

            <div id="admin-form-box" class="col-md-8 admin-panel">
                <h4 class="mb-4 text-success"><i class="fa-solid fa-circle-plus"></i> เพิ่มรางวัลเกียรติยศใหม่</h4>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">ประเภทรางวัล</label>
                        <select id="form-type" class="form-select" onchange="adjustFormFields()">
                            <option value="school">🏢 รางวัลสถานศึกษา</option>
                            <option value="staff">🧑‍🏫 รางวัลครูและบุคลากร</option>
                            <option value="student" selected>🧑‍🎓 รางวัลนักเรียน</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">ปีการศึกษา</label>
                        <input type="number" id="form-year" class="form-control" value="2569">
                    </div>
                    
                    <div class="col-12" id="field-name-box">
                        <label class="form-label" id="label-name">ชื่อ-นามสกุล นักเรียน</label>
                        <input type="text" id="form-name" class="form-control">
                    </div>
                    <div class="col-md-6" id="field-class-box">
                        <label class="form-label">ชั้นเรียน</label>
                        <input type="text" id="form-class" class="form-control" placeholder="เช่น ม.6/1">
                    </div>
                    <div class="col-md-6" id="field-dept-box">
                        <label class="form-label" id="label-dept">กลุ่มสาระการเรียนรู้</label>
                        <select id="form-dept" class="form-select">
                            <option value="ฝ่ายบริหาร">ฝ่ายบริหาร</option>
                            <option value="ภาษาไทย">ภาษาไทย</option>
                            <option value="คณิตศาสตร์">คณิตศาสตร์</option>
                            <option value="วิทยาศาสตร์">วิทยาศาสตร์</option>
                            <option value="คอมพิวเตอร์">คอมพิวเตอร์</option>
                            <option value="สังคมศึกษา ศาสนาและวัฒนธรรม">สังคมศึกษา ศาสนาและวัฒนธรรม</option>
                            <option value="ภาษาต่างประเทศ">ภาษาต่างประเทศ</option>
                            <option value="สุขศึกษาและพลศึกษา">สุขศึกษาและพลศึกษา</option>
                            <option value="การงานอาชีพ">การงานอาชีพ</option>
                            <option value="ศิลปะ">ศิลปะ</option>
                            <option value="กิจกรรมพัฒนาผู้เรียน">กิจกรรมพัฒนาผู้เรียน</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label class="form-label">ชื่อรางวัล/ผลงานเกียรติยศ</label>
                        <input type="text" id="form-title" class="form-control">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">หน่วยงานที่มอบรางวัล</label>
                        <input type="text" id="form-agency" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label text-danger">แนบไฟล์เกียรติบัตร (รับเฉพาะไฟล์ PDF เท่านั้น)</label>
                        <input type="file" id="form-file" class="form-control" accept="application/pdf">
                    </div>
                    
                    <div class="col-12 text-end mt-4">
                        <button class="btn btn-secondary me-2 rounded-pill px-4" onclick="closeAdminPanel()">ยกเลิก</button>
                        <button class="btn btn-success rounded-pill px-4" id="btn-save" onclick="uploadAndSave()"><i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="main-dashboard">
            <div class="row g-3 mb-4">
                <div class="col-md-4"><div class="category-btn bg-school" onclick="selectMainCategory('school')"><i class="fa-solid fa-school fa-3x mb-2"></i><h5>รางวัลสถานศึกษา</h5></div></div>
                <div class="col-md-4"><div class="category-btn bg-staff" onclick="selectMainCategory('staff')"><i class="fa-solid fa-chalkboard-user fa-3x mb-2"></i><h5>รางวัลครูและบุคลากรฯ</h5></div></div>
                <div class="col-md-4"><div class="category-btn bg-student" onclick="selectMainCategory('student')"><i class="fa-solid fa-user-graduate fa-3x mb-2"></i><h5>รางวัลนักเรียน</h5></div></div>
            </div>

            <div class="row mb-4 justify-content-center d-none" id="filter-section">
                <div class="col-md-6">
                    <div class="card p-3 shadow-sm border-0 rounded-3">
                        <label class="form-label text-muted fw-bold"><i class="fa-solid fa-filter"></i> คัดกรองตามกลุ่มสาระการเรียนรู้</label>
                        <select id="filter-dept" class="form-select" onchange="filterCards()">
                            <option value="ALL">-- แสดงทั้งหมด ทุกกลุ่มสาระฯ --</option>
                            <option value="ฝ่ายบริหาร">ฝ่ายบริหาร</option>
                            <option value="ภาษาไทย">ภาษาไทย</option>
                            <option value="คณิตศาสตร์">คณิตศาสตร์</option>
                            <option value="วิทยาศาสตร์">วิทยาศาสตร์</option>
                            <option value="คอมพิวเตอร์">คอมพิวเตอร์</option>
                            <option value="สังคมศึกษา ศาสนาและวัฒนธรรม">สังคมศึกษา ศาสนาและวัฒนธรรม</option>
                            <option value="ภาษาต่างประเทศ">ภาษาต่างประเทศ</option>
                            <option value="สุขศึกษาและพลศึกษา">สุขศึกษาและพลศึกษา</option>
                            <option value="การงานอาชีพ">การงานอาชีพ</option>
                            <option value="ศิลปะ">ศิลปะ</option>
                            <option value="กิจกรรมพัฒนาผู้เรียน">กิจกรรมพัฒนาผู้เรียน</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                </div>
            </div>

            <h5 class="mb-3 fw-bold text-secondary" id="display-title">รายการรางวัล</h5>
            <div class="row g-3" id="cards-container">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-muted">กำลังดึงข้อมูลจากฐานข้อมูล Google Sheets...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bundle.min.js"></script>
    <script>
        // 🛑 >>> นำลิงก์ Web App URL ที่ได้จาก GAS มาแปะตรงนี้ครับ <<<
        const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxE7FswOf3r9E6olu-_Ss-CH4VMwT1A2Cs45WZsjR5LBvbHe3LymyXVUfNTJwU5xBXhLg/exec';

        let allAwardsData = {};
        let currentActiveCategory = 'student';
        let isTeacherLoggedIn = false;

        window.onload = function() {
            adjustFormFields();
            loadAllAwards();
        };

        // ใช้ Fetch API เพื่อดึงข้อมูลข้ามมาจาก GAS หลังบ้าน
        function loadAllAwards() {
            fetch(GAS_WEB_APP_URL)
                .then(res => res.json())
                .then(data => {
                    allAwardsData = data;
                    selectMainCategory(currentActiveCategory);
                })
                .catch(err => {
                    document.getElementById('cards-container').innerHTML = '<div class="col-12 text-center text-danger py-5">❌ ไม่สามารถโหลดข้อมูลได้ กรุณาตรวจสอบการตั้งค่า Deploy ของ GAS</div>';
                });
        }

        function selectMainCategory(cat) {
            currentActiveCategory = cat;
            const titles = { 'school': '🏢 รางวัลสถานศึกษา', 'staff': '🧑‍🏫 รางวัลครูและบุคลากรฯ', 'student': '🧑‍🎓 รางวัลนักเรียน' };
            document.getElementById('display-title').innerHTML = titles[cat];
            
            if (cat === 'school') {
                document.getElementById('filter-section').classList.add('d-none');
            } else {
                document.getElementById('filter-section').classList.remove('d-none');
                document.getElementById('filter-dept').value = 'ALL';
            }
            renderCards(allAwardsData[cat]);
        }

        function renderCards(items) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            if (!items || items.length === 0) {
                container.innerHTML = '<div class="col-12 text-center text-muted py-5">❌ ยังไม่มีข้อมูลบันทึกในระบบ</div>';
                return;
            }
            items.forEach(function(item) {
                let badgeHtml = ''; let detailsHtml = '';
                if (currentActiveCategory === 'staff') {
                    badgeHtml = `<span class="badge badge-dept text-dark mb-2"><i class="fa-solid fa-tag text-purple"></i> สาระฯ${item.department}</span>`;
                    detailsHtml = `<p class="card-text mb-1 text-primary fw-bold"><i class="fa-solid fa-user-tie me-1"></i> ผู้รับ: ${item.receiver_name}</p>`;
                } else if (currentActiveCategory === 'student') {
                    badgeHtml = `<span class="badge badge-dept text-dark mb-2"><i class="fa-solid fa-tag text-orange"></i> สาระฯ${item.category}</span>`;
                    detailsHtml = `<p class="card-text mb-1 text-primary fw-bold"><i class="fa-solid fa-user-graduate me-1"></i> ผู้รับ: ${item.student_name} (${item.class})</p>`;
                }
                const cardHtml = `
                    <div class="col-md-4 card-item" data-dept="${item.department || item.category || ''}">
                        <div class="card h-100 award-card p-3">
                            <div class="d-flex justify-content-between align-items-start">
                                <span class="badge bg-dark rounded-pill mb-2">${item.award_id}</span>
                                <span class="badge bg-secondary rounded-pill">ปี ${item.year}</span>
                            </div>
                            <div class="card-body p-1 mt-2">
                                ${badgeHtml}
                                <h6 class="card-title fw-bold text-dark mt-1">${item.award_name}</h6>
                                ${detailsHtml}
                                <p class="card-text small text-muted mb-3"><i class="fa-solid fa-building-flag me-1"></i> มอบโดย: ${item.agency}</p>
                            </div>
                            <div class="card-footer bg-transparent border-0 p-0 text-end">
                                <a href="${item.document_link}" target="_blank" class="btn btn-outline-danger w-100 rounded-pill btn-sm fw-bold">
                                    <i class="fa-solid fa-file-pdf me-1"></i> เปิดดูเกียรทีบัตร (PDF)
                                </a>
                            </div>
                        </div>
                    </div>`;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        }

        function filterCards() {
            const filterVal = document.getElementById('filter-dept').value;
            const cards = document.querySelectorAll('.card-item');
            cards.forEach(card => {
                if (filterVal === 'ALL' || card.getAttribute('data-dept') === filterVal) { card.style.display = 'block'; } 
                else { card.style.display = 'none'; }
            });
        }

        function toggleLoginSection() {
            const section = document.getElementById('login-section');
            if (section.classList.contains('d-none')) {
                section.classList.remove('d-none');
                if (isTeacherLoggedIn) { document.getElementById('admin-form-box').style.display = 'block'; } 
                else { document.getElementById('login-form-box').style.display = 'block'; }
            } else { section.classList.add('d-none'); }
        }

        function adjustFormFields() {
            const type = document.getElementById('form-type').value;
            const fName = document.getElementById('field-name-box'); const fClass = document.getElementById('field-class-box'); const fDept = document.getElementById('field-dept-box');
            if (type === 'school') { fName.style.display = 'none'; fClass.style.display = 'none'; fDept.style.display = 'none'; } 
            else if (type === 'staff') {
                fName.style.display = 'block'; fClass.style.display = 'none'; fDept.style.display = 'block';
                document.getElementById('label-name').innerText = 'ชื่อ-นามสกุล ของครู / บุคลากร';
            } else if (type === 'student') {
                fName.style.display = 'block'; fClass.style.display = 'block'; fDept.style.display = 'block';
                document.getElementById('label-name').innerText = 'ชื่อ-นามสกุล นักเรียน';
            }
        }

        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(!user || !pass) { alert('กรุณากรอกข้อมูลให้ครบถ้วน'); return; }
            
            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', username: user, password: pass })
            })
            .then(res => res.json())
            .then(res => {
                if (res.success) {
                    isTeacherLoggedIn = true;
                    document.getElementById('btn-login-trigger').classList.add('d-none');
                    document.getElementById('welcome-text').innerText = 'สวัสดีครับ คุณ' + res.teacherName;
                    document.getElementById('welcome-text').classList.remove('d-none');
                    document.getElementById('btn-logout').classList.remove('d-none');
                    document.getElementById('login-form-box').style.display = 'none';
                    document.getElementById('admin-form-box').style.display = 'block';
                } else { alert(res.message); }
            });
        }

        function logout() {
            isTeacherLoggedIn = false;
            document.getElementById('btn-login-trigger').classList.remove('d-none');
            document.getElementById('welcome-text').classList.add('d-none');
            document.getElementById('btn-logout').classList.add('d-none');
            document.getElementById('admin-form-box').style.display = 'none';
            document.getElementById('login-section').classList.add('d-none');
            document.getElementById('username').value = ''; document.getElementById('password').value = '';
        }

        function closeAdminPanel() { document.getElementById('login-section').classList.add('d-none'); }

        function uploadAndSave() {
            const type = document.getElementById('form-type').value;
            const fileInput = document.getElementById('form-file');
            const saveBtn = document.getElementById('btn-save');
            
            const formData = {
                year: document.getElementById('form-year').value,
                award_name: document.getElementById('form-title').value,
                agency: document.getElementById('form-agency').value,
                receiver_name: document.getElementById('form-name').value,
                department: document.getElementById('form-dept').value,
                student_name: document.getElementById('form-name').value,
                class: document.getElementById('form-class').value,
                category: document.getElementById('form-dept').value
            };

            if (!formData.year || !formData.award_name || !formData.agency) { alert('กรุณากรอกรายละเอียดให้ครบถ้วน'); return; }
            if (fileInput.files.length === 0) { alert('🛑 จำเป็นต้องแนบไฟล์เกียรติบัตรเป็น PDF!'); return; }
            
            const file = fileInput.files[0];
            if (file.type !== "application/pdf") { alert('🛑 ระบบรองรับเฉพาะไฟล์ .pdf เท่านั้นครับ'); return; }
            
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> กำลังอัปโหลดไปยังระบบเก็บไฟล์...';

            const reader = new FileReader();
            reader.onload = function(e) {
                const fileData = { base64: e.target.result.split(',')[1], type: file.type };

                fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'saveAward', type: type, formData: formData, fileData: fileData })
                })
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        alert('🎉 บันทึกข้อมูลและจัดเก็บลงโฟลเดอร์สำเร็จ! รหัสรางวัล: ' + res.awardId);
                        document.getElementById('form-title').value = '';
                        document.getElementById('form-agency').value = '';
                        document.getElementById('form-name').value = '';
                        document.getElementById('form-class').value = '';
                        fileInput.value = '';
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล';
                        loadAllAwards();
                    } else {
                        alert('เกิดข้อผิดพลาด: ' + res.message);
                        saveBtn.disabled = false;
                        saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล';
                    }
                });
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
